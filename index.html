          "$Q=Pt$", ['Công suất là $P='+(2*a)+'$ kW và thời gian là 30 s, nên $Q=Pt='+(2*a)+'\\cdot30='+(60*a)+'$ kJ.', 'Suy ra $Q='+(60*a)+'$ kJ.'], 'kJ', 'Công suất nhân thời gian cho năng lượng; nhớ kW·s = kJ.', "$Q=P/t$");
        break;
      case 'ly-b19':
        set('Sóng điện từ truyền trong chân không với $c=3\\cdot10^8$ m/s. Nếu tần số $f='+(a)+'\\cdot10^6$ Hz, bước sóng bằng bao nhiêu m?', 300/a,
          "$\\lambda=\\frac{c}{f}$", ['Bước sóng bằng vận tốc chia tần số.', 'Thay số: $\\lambda=\\frac{3\\cdot10^8}{'+a+'\\cdot10^6}='+fmt(300/a)+'$ m.'], 'm', 'Dùng λ = c/f; đổi đơn vị tần số theo lũy thừa 10.', "$\\lambda=cf$");
        break;
      case 'ly-b20':
        set('Dây dẫn dài $1$ m đặt vuông góc trong từ trường $B=0,2$ T, dòng điện chạy qua là $I='+a+'$ A. Lực từ tác dụng lên dây bằng bao nhiêu N?', 0.2*a,
          "$F=BIL$ (khi dây vuông góc với từ trường)", ['Vì dây vuông góc với từ trường: $F=BIL$.', 'Thay số: $F=0,2\\cdot'+a+'\\cdot1='+(0.2*a)+'$ N.'], 'N', 'Dùng công thức lực từ cho dây dẫn mang dòng điện.', "$F=B/I L$");
        break;
      case 'ly-b21':
        set('Một hạt nhân có số proton $Z='+(a+2)+'$ và số neutron $N='+(2*a)+'$. Số khối $A$ bằng bao nhiêu?', 3*a+2,
          "$A=Z+N$", ['Số khối bằng tổng số proton và neutron.', 'Thay số: $A='+(a+2)+'+'+(2*a)+'='+(3*a+2)+'$.'], '', 'Số khối là tổng proton và neutron.', "$A=Z-N$");
        break;
      case 'ly-b22':
        if (t.topicId.endsWith('-t1')) set('Trong phân rã beta trừ, hạt nhân mẹ có số proton $Z='+a+'$. Bỏ qua phần còn lại của phương trình, số proton của hạt nhân con bằng bao nhiêu?', a+1,
          "$Z_{\\text{con}}=Z_{\\text{mẹ}}+1$", ['Trong phân rã $\\beta^-$, một neutron chuyển thành proton, electron và phản neutrino.', 'Số proton tăng thêm 1: $Z_{con}='+a+'+1='+(a+1)+'$.'], '', 'Phân rã beta trừ làm số proton tăng một, số khối bảo toàn.', "$Z_{con}=Z_{mẹ}-1$");
        else set('Độ hụt khối của một hạt nhân là $\\Delta m='+(a/1000)+'$ u. Dùng $1\\,u\\,c^2\\approx931,5$ MeV, năng lượng liên kết bằng bao nhiêu MeV?', 0.9315*a,
          "$E_{lk}=\\Delta m c^2$ và $1u\\,c^2\\approx931,5$ MeV", ['Dùng hệ thức Einstein $E=\\Delta mc^2$.', 'Năng lượng liên kết $E='+(a/1000)+'\\cdot931,5='+(0.9315*a)+'$ MeV.'], 'MeV', 'Nhân độ hụt khối tính bằng u với 931,5 MeV/u.', "$E=\\Delta m/c^2$");
        break;
      case 'ly-b23':
        set('Mẫu phóng xạ có ban đầu $N_0='+(8*a)+'$ hạt. Sau 3 chu kì bán rã, số hạt chưa phân rã còn lại là bao nhiêu?', a,
          "$N=N_0\\left(\\frac12\\right)^n$", ['Sau 3 chu kì, $N=N_0/2^3$.', 'Thay số: $N='+(8*a)+'/8='+a+'$ hạt.'], 'hạt', 'Mỗi chu kì bán rã, số hạt còn lại giảm một nửa.', "$N=N_0/3$");

          "$E=nE_1$", ['Năng lượng mỗi phản ứng: $200\\cdot1,602\\cdot10^{-13}=3,204\\cdot10^{-11}$ J.', 'Với $n='+(a*1000000)+'$ phản ứng: $E=3,204\\cdot10^{-11}\\cdot'+(a*1000000)+'='+fmt(3.204e-5*a)+'$ J.'], 'J', 'Đổi MeV sang joule trước khi nhân số phản ứng.', "$E=E_1/n$");
        break;
      case 'ly-b25':
        set('Mẫu phóng xạ có số hạt ban đầu $N_0='+(16*a)+'$. Sau thời gian bằng hai chu kì bán rã, số hạt chưa phân rã còn lại là bao nhiêu?', 4*a,
          "$N=N_0\\left(\\frac12\\right)^n$", ['Sau hai chu kì bán rã, số hạt còn lại bằng $N_0/4$.', 'Tính $N='+(16*a)+'/4='+(4*a)+'$.'], 'hạt', 'Sau n chu kì bán rã, nhân số hạt ban đầu với 1/2^n.', "$N=N_0/2n$");

      "$a+k$", ['Thay $a='+a+'$ và $k='+k+'$.', 'Tính được $a+k='+(a+k)+'$.'], '', 'Thay số và tính theo thứ tự phép toán.', "$a-k$");
  }
  p.answer = rnd(Number(p.answer));
  p.topic = topic;
  return p;
}

function makeVariants(topic, variant, p) {
  const n = Number(p.answer);
  const unitRaw = String(p.unit || '').trim();
  const unit = unitText(unitRaw);
  const discreteUnit = /^(ý|giá trị|nghiệm|điểm|lần|quá trình|cực|cực từ|nam châm|luận điểm|mệnh đề|trường hợp|phương án|đặc điểm|nội dung|cặp|người|vật)$/i.test(unitRaw);
  let step;
  if (discreteUnit) step = 1;
  else if (Math.abs(n) >= 100) step = Math.max(1, Math.round(Math.abs(n) * 0.1));
  else if (Math.abs(n) >= 10) step = Math.max(1, Math.round(Math.abs(n) * 0.15));
  else step = Math.abs(n) * 0.2 || 0.5;

  // Tạo nhiễu theo lỗi tính toán thường gặp, tránh đáp án kiểu 3,6 ý hoặc 2,4 nghiệm.
  const wrongValues = [];
  function addWrong(value) {
    if (!Number.isFinite(value)) return;
    value = discreteUnit ? Math.round(value) : rnd(value, Math.abs(n) < 1 ? 4 : 2);
    if (discreteUnit && value < 0) return;
    if (Math.abs(value - n) < 1e-8) return;
    if (wrongValues.some(v => Math.abs(v - value) < 1e-8)) return;
    wrongValues.push(value);
  }
  [n + step, n - step, n + 2 * step, n - 2 * step, n + 3 * step, n * 2, n / 2, -n, n + 4 * step, n - 4 * step].forEach(addWrong);
  let attempts = 0;
  while (wrongValues.length < 3 && attempts < 80) {
    attempts++;
    addWrong(n + (attempts % 2 ? 1 : -1) * step * (Math.floor(attempts / 2) + 1));
  }
  // Phòng trường hợp đáp số rất đặc biệt (ví dụ 0), bảo đảm đủ bốn phương án khác nhau.
  while (wrongValues.length < 3) {
    const candidate = discreteUnit ? Math.abs(n) + wrongValues.length + 1 : n + (wrongValues.length + 1) * 0.37;
    addWrong(candidate);
  }

  const correctIndex = variant % 4;
  const opts = new Array(4);
  opts[correctIndex] = n;
  let wrongIndex = 0;
  for (let i = 0; i < 4; i++) if (i !== correctIndex) opts[i] = wrongValues[wrongIndex++];

  const nText = fmt(n) + unit;
  const wrongText1 = fmt(wrongValues[0]) + unit;
  const wrongText2 = fmt(wrongValues[1]) + unit;
  const stepText = (p.steps || []).filter(Boolean);
  const baseExplain = {
    correct: 'Đáp án đúng là ' + nText + '. ' + p.why,
    wrong: 'Hãy đối chiếu từng bước thay số với công thức đã chọn. ' + p.why,
    perOption: [],
    steps: stepText.length ? stepText : ['Áp dụng công thức $' + p.formula + '$.', 'Thay dữ kiện vào công thức và tính được $' + nText + '$.'],
    related: p.formula,
    mistake: 'Kiểm tra lại công thức, dấu phép tính và đơn vị trước khi kết luận.',
    tip: p.hint,
    next: 'Khi đã hiểu các bước, hãy thử một câu cùng dạng với dữ kiện khác.'
  };
  const mk = (type, question, options, correct, numeric, perOption) => ({
    id: 'gen-' + topic.topicId + '-v' + String(variant + 1).padStart(3, '0') + '-' + type,
    type,
    difficulty: (variant % 4) + 1,
    cognitive: ['NB', 'TH', 'VD', 'VDC'][variant % 4],
    subject: topic.subjectId,
    chapterId: topic.chapterId,
    lessonId: topic.lessonId,
    topicId: topic.topicId,
    question,
    options: options || null,
    correct,
    hint: p.hint,
    numeric: numeric || (type === 'numeric' || type === 'short' ? {
      answer: n, accept: [String(n), String(n).replace('.', ',')],
      tolerance: (Math.abs(n) < 0.001 ? 1e-8 : 0.00005), unit: p.unit || '', unitRequired: false
    } : null),
    explain: perOption && perOption.length ? Object.assign({}, baseExplain, { perOption: perOption }) : baseExplain,
    generated: true
  });

  const displayOpts = opts.map(v => '$' + fmt(v) + '$' + unit);
  const mc1PerOption = opts.map((v, i) => i === correctIndex
    ? 'Đúng. Thay dữ kiện vào công thức sẽ thu được ' + nText + '.'
    : 'Chưa đúng. Giá trị này không khớp với kết quả tính từ dữ kiện; hãy kiểm tra lại phép thay số và phép tính.');

  const formulaText = String(p.formula || '').replace(/^\$+|\$+$/g, '').trim();
  const formulaLooksMathematical = /[=\\]|\\\\(?:frac|int|sqrt|vec|Delta|Phi|mathcal|overline)/.test(formulaText);
  const plainFormulaText = formulaText.replace(/[.。]+$/, '');
  const formulaStatement = formulaLooksMathematical
    ? 'Công thức phù hợp là $' + plainFormulaText + '$.'
    : 'Kiến thức cần nhớ: ' + plainFormulaText + '.';
  const multiBase = [
    { text: 'Kết quả cần tìm bằng $' + fmt(n) + '$' + unit + '.', right: true, explanation: 'Đúng. Giá trị này khớp với kết quả tính toán.' },
    { text: 'Kết quả cần tìm bằng $' + wrongText1.replace(unit, '') + '$' + unit + '.', right: false, explanation: 'Chưa đúng. Đối chiếu với các bước giải để phát hiện sai sót khi thay số hoặc tính toán.' },
    { text: formulaStatement, right: true, explanation: 'Đúng. Đây là công thức hoặc kiến thức cốt lõi phù hợp với bài toán.' },
    { text: 'Kết quả cần tìm bằng $' + wrongText2.replace(unit, '') + '$' + unit + '.', right: false, explanation: 'Chưa đúng. Kết quả này không phù hợp với dữ kiện đã cho.' }
  ];
  // Xoay vị trí các mệnh đề đúng giữa các phương án để không lộ quy luật đáp án.
  const rotation = variant % 4;
  const multiArranged = new Array(4);
  multiBase.forEach((item, i) => { multiArranged[(i + rotation) % 4] = item; });
  const multiOptions = multiArranged.map(item => item.text);
  const multiCorrect = multiArranged.map((item, i) => item.right ? i : -1).filter(i => i >= 0);
  const multiPerOption = multiArranged.map(item => item.explanation);
  const tfValue = variant % 2 === 0 ? n : wrongValues[variant % wrongValues.length];
  const tfCorrect = Math.abs(tfValue - n) < 1e-8;
  const oneQuestion = p.prompt;

  return [
    mk('mc1', oneQuestion, displayOpts, correctIndex, null, mc1PerOption),
    mk('mcq', 'Chọn tất cả mệnh đề đúng dựa trên dữ kiện: ' + oneQuestion, multiOptions, multiCorrect, null, multiPerOption),
    mk('tf', 'Mệnh đề sau đúng hay sai? ' + oneQuestion + ' Kết quả là $' + fmt(tfValue) + '$' + unit + '.', null, tfCorrect, null),
    mk('short', oneQuestion, null, String(n), { answer: n, accept: [String(n), String(n).replace('.', ',')], tolerance: (Math.abs(n) < 0.001 ? 1e-8 : 0.00005), unit: p.unit || '', unitRequired: false }),
    mk('numeric', oneQuestion, null, n, { answer: n, accept: [String(n), String(n).replace('.', ',')], tolerance: (Math.abs(n) < 0.001 ? 1e-8 : 0.00005), unit: p.unit || '', unitRequired: false })
  ];
}

const existing = new Set(G.QUESTIONS_TOAN.concat(G.QUESTIONS_LY).map(q=>q.id));
const genToan = [], genLy = [];
C.allTopics().forEach(topic => {
  // Hai chủ đề khái niệm có số đáp án cố định chỉ sinh 8 cách diễn đạt.
  // 73 chủ đề tính toán × 274 cấu hình + 2 chủ đề khái niệm × 8 cấu hình,
  // mỗi cấu hình có 5 hình thức = 100.090 biến thể tự động.
  // Đây không phải 100.090 câu được biên soạn độc lập.
  const variantCount = topic.lessonId === 'ly-b1' ? 8 : 274;
  for (let i=0; i<variantCount; i++) {
    const spec = makeProblem(topic, i);
    makeVariants(topic, i, spec).forEach(q => {
      if (existing.has(q.id)) return;
      existing.add(q.id);
      (topic.subjectId === 'toan' ? genToan : genLy).push(q);
    });
  }
});
G.QUESTIONS_TOAN = G.QUESTIONS_TOAN.concat(genToan);
G.QUESTIONS_LY = G.QUESTIONS_LY.concat(genLy);
G.GENERATED_BANK_STATS = {
  generatedToan: genToan.length,
  generatedLy: genLy.length,
  totalToan: G.QUESTIONS_TOAN.length,
  totalLy: G.QUESTIONS_LY.length,
  bySubjectAndType: function () {
    const result = {};
    [['toan',G.QUESTIONS_TOAN],['ly',G.QUESTIONS_LY]].forEach(([s,arr]) => {
      result[s] = {};
      arr.forEach(q => { result[s][q.type]=(result[s][q.type]||0)+1; });
    });
    return result;
  }
};
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script data-module="core">
/* ===== MODULE: core (js/core.js) ===== */
/* ============================================================
   LÕI HỆ THỐNG: MathLib (KaTeX + chấm điểm) · Store (localStorage)
   ============================================================ */
(function (G) {
'use strict';

/* ================= MathLib: KaTeX + so sánh đáp án ================= */
function tex(str, display) {
  if (str == null || str === '') return '';
  const s = String(str);
  try {
    /* Chuỗi hỗn hợp: giữ nguyên văn bản thường (đã escape) và render công thức $...$ */
    if (s.indexOf('$') >= 0) {
      let out = '', last = 0, m;
      const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
      while ((m = re.exec(s))) {
        out += esc(s.slice(last, m.index));
        const isDisplay = m[1] !== undefined;
        out += window.katex.renderToString(isDisplay ? m[1] : m[2],
          { displayMode: isDisplay || !!display, throwOnError: false, strict: false });
        last = m.index + m[0].length;
      }
      out += esc(s.slice(last));
      return out;
    }
    return window.katex.renderToString(s, { displayMode: !!display, throwOnError: false, strict: false });
  }
  catch (e) { return '<code>' + esc(s) + '</code>'; }
}
/* Quét các node văn bản còn chứa $...$ (phần giải thích, lý thuyết) và render */
function renderMath(root) {
  if (!root || !window.katex || typeof document === 'undefined' || !document.createTreeWalker) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || n.nodeValue.indexOf('$') < 0) return NodeFilter.FILTER_REJECT;
      let el = n.parentElement;
      while (el) {
        if (el.nodeType === 1 && (el.hasAttribute('data-tex') || el.classList.contains('katex') ||
          /^(SCRIPT|STYLE|TEXTAREA|CODE|PRE)$/i.test(el.tagName))) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function (n) {
    const span = document.createElement('span');
    span.innerHTML = tex(n.nodeValue, false);
    n.parentNode.replaceChild(span, n);
  });
}
function renderInto(el) {
  if (!el) return;
  el.querySelectorAll('[data-tex]').forEach(function (n) {
    if (n.dataset.texDone) return;
    n.innerHTML = tex(n.getAttribute('data-tex'), n.getAttribute('data-display') === '1');
    n.dataset.texDone = '1';
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

/* Chuẩn hóa số: chấp nhận 0.5 / ,5 / 1/2 / -2e3 */
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  let t = String(s).trim().replace(/\s+/g, '').replace(/,/g, '.');
  if (t === '') return NaN;
  const frac = t.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (frac) return parseFloat(frac[1]) / parseFloat(frac[2]);
  return parseFloat(t);
}
function checkNumeric(input, numeric) {
  const v = parseNum(input);
  if (isNaN(v)) return { ok: false, reason: 'Đáp án không phải là một số hợp lệ.' };
  const tol = (numeric && numeric.tolerance !== undefined) ? numeric.tolerance : 0;
  if (Math.abs(v - numeric.answer) > tol + 1e-9) return { ok: false, reason: 'Kết quả chưa đúng so với đáp số chuẩn.' };
  if (numeric.unitRequired && numeric.unit) {
    const has = new RegExp(numeric.unit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(String(input));
    if (!has) return { ok: false, reason: 'Thiếu đơn vị yêu cầu (' + numeric.unit + ').' };
  }
  return { ok: true };
}

/* So sánh đáp án theo loại câu: mc1 | mcq | tf | short | numeric */
function grade(q, answer) {
  if (answer === null || answer === undefined || answer === '' ||
      (Array.isArray(answer) && answer.length === 0)) {
    return { state: 'blank', correct: false };
  }
  switch (q.type) {
    case 'mc1': {
      const i = Number(answer);
      const ok = i === q.correct;
      return { state: ok ? 'correct' : 'wrong', correct: ok, chosen: i };
    }
    case 'mcq': {
      const chosen = (Array.isArray(answer) ? answer.slice() : [answer]).map(Number).sort(function (a, b) { return a - b; });
      const want = (Array.isArray(q.correct) ? q.correct : [q.correct]).slice().map(Number).sort(function (a, b) { return a - b; });
      const ok = chosen.length === want.length && chosen.every(function (v, k) { return v === want[k]; });
      return { state: ok ? 'correct' : 'wrong', correct: ok, chosen: chosen, want: want,
               missing: want.filter(function (x) { return chosen.indexOf(x) < 0; }),
               extra: chosen.filter(function (x) { return want.indexOf(x) < 0; }) };
    }
    case 'tf': {
      const ok = String(answer) === String(q.correct);
      return { state: ok ? 'correct' : 'wrong', correct: ok };
    }
    case 'short': {
      const norm = function (s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/,/g, '.'); };
      const accept = [q.correct].concat(q.numeric && q.numeric.accept ? q.numeric.accept : []);
      const ok = accept.some(function (a) { return norm(a) === norm(answer); });
      return { state: ok ? 'correct' : 'wrong', correct: ok };
    }
    case 'numeric': {
      const r = checkNumeric(answer, q.numeric);
      return { state: r.ok ? 'correct' : 'wrong', correct: r.ok, reason: r.reason };
    }
    default:
      return { state: 'wrong', correct: false };
  }
}

/* Tập câu hỏi: gộp một lần để tránh cấp phát lại mảng lớn ở mỗi lần lọc. */
let allQuestionsCache = null;
const Bank = {
  all: function () {
    if (!allQuestionsCache) allQuestionsCache = (G.QUESTIONS_TOAN || []).concat(G.QUESTIONS_LY || []);
    return allQuestionsCache;
  },
  byId: function (id) {
    const all = Bank.all();
    for (let i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  },
  bySubject: function (s) { return Bank.all().filter(function (q) { return q.subject === s; }); },
  countByTopic: function (s) {
    const m = {};
    Bank.bySubject(s).forEach(function (q) { m[q.topicId] = (m[q.topicId] || 0) + 1; });
    return m;
  },
  filter: function (f) {
    f = f || {};
    return Bank.all().filter(function (q) {
      if (f.subject && q.subject !== f.subject) return false;
      if (f.chapterId && q.chapterId !== f.chapterId) return false;
      if (f.lessonId && q.lessonId !== f.lessonId) return false;
      if (f.topicId && q.topicId !== f.topicId) return false;
      if (f.cognitive && f.cognitive !== 'ALL' && q.cognitive !== f.cognitive) return false;
      if (f.ids && f.ids.indexOf(q.id) < 0) return false;
      if (f.type && q.type !== f.type) return false;
      if (f.difficulty !== undefined && f.difficulty !== null && f.difficulty !== '' && Number(q.difficulty) !== Number(f.difficulty)) return false;
      return true;
    });
  },
  sample: function (list, n) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return n && n > 0 ? a.slice(0, n) : a;
  },
  /* API tên shuffle được các màn hình sử dụng; dùng cùng thuật toán Fisher–Yates. */
  shuffle: function (list) { return Bank.sample(Array.isArray(list) ? list : Bank.all()); },
  /* Xếp theo mức độ nhận thức tăng dần (học từ dễ đến khó) */
  byLevel: function (arr) {
    const order = { NB: 0, TH: 1, VD: 2, VDC: 3 };
    return (arr || Bank.all()).slice().sort(function (a, b) {
      const d = (order[a.cognitive] - order[b.cognitive]) || (a.difficulty - b.difficulty);
      return d || (a.id < b.id ? -1 : 1);
    });
  },
  similar: function (q, limit) {
    const pool = Bank.filter({ topicId: q.topicId }).filter(function (x) { return x.id !== q.id; });
    const sameCog = pool.filter(function (x) { return x.cognitive === q.cognitive; });
    return Bank.sample(sameCog.length ? sameCog : pool, limit || 3);
  }
};

G.MathLib = { tex: tex, renderInto: renderInto, renderMath: renderMath, esc: esc, parseNum: parseNum, checkNumeric: checkNumeric, grade: grade, Bank: Bank };

/* ================= UI helpers ================= */
function toast(msg, kind) {
  if (typeof document === 'undefined' || !document.getElementById) return;
  const wrap = document.getElementById('toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast toast--' + (kind || 'info');
  el.innerHTML = esc(msg);
  wrap.appendChild(el);
  setTimeout(function () { el.classList.add('is-out'); setTimeout(function () { el.remove(); }, 300); }, 2600);
}
function chip(text, kind) {
  return '<span class="chip chip--' + (kind || 'neutral') + '">' + esc(text) + '</span>';
}
function card(title, body, opts) {
  opts = opts || {};
  let h = '<section class="card' + (opts.flush ? ' card--flush' : '') + '">';
  if (title) h += '<div class="card__head"><h2 class="card__title">' + title + '</h2>' + (opts.headExtra || '') + '</div>';
  h += '<div class="' + (opts.bodyClass || 'card__body') + '">' + body + '</div></section>';
  return h;
}
function empty(title, desc, action) {
  return '<div class="empty"><div class="empty__icon" aria-hidden="true">🗒️</div>' +
    '<h3>' + esc(title) + '</h3><p>' + esc(desc) + '</p>' + (action || '') + '</div>';
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
}
const COG_LABEL = { NB: 'Nhận biết', TH: 'Thông hiểu', VD: 'Vận dụng', VDC: 'Vận dụng cao' };
const TYPE_LABEL = { mc1: 'Một đáp án', mcq: 'Nhiều đáp án', tf: 'Đúng/Sai', short: 'Điền ngắn', numeric: 'Điền đáp số' };

G.UI = {
  toast: toast, chip: chip, card: card, empty: empty, emptyState: empty,
  fmtDate: fmtDate, esc: esc, tex: tex, renderInto: renderInto, renderMath: renderMath,
  COG_LABEL: COG_LABEL, TYPE_LABEL: TYPE_LABEL
};
/* ================= Store: localStorage + tiến độ học tập ================= */
const KEY = 'ontap12.v1';

const defaultData = {
  version: 1,
  settings: { dark: false, theme: 'blue' },
  attempts: {},        /* questionId -> [ {answer, correct, at, mode, understood} ] */
  status: {},          /* questionId -> 'new' | 'learning' | 'mastered' */
  understood: {},      /* questionId -> true (đã hiểu sau lời giải) */
  flagged: {},         /* questionId -> true (đánh dấu ôn lại) */
  theoryStatus: {},    /* lessonId -> 'new' | 'learning' | 'mastered' */
  theoryFlagged: {},   /* lessonId -> true */
  bookmarks: {},       /* lessonId -> true */
  notes: {},           /* key -> [{text, at}] */
  formulaSaves: {},    /* formulaKey -> {title, tex, at} */
  sessions: [],        /* [{id, subject, filters, ids, at, done}] */
  currentSession: null /* phiên luyện tập đang dở: {ids, index, subject, label} */
};

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultData));
    const d = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(defaultData)), d);
  } catch (e) { console.warn('[store] lỗi đọc dữ liệu, dùng mặc định', e); return JSON.parse(JSON.stringify(defaultData)); }
}
let data = load();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { G.UI && G.UI.toast('Không lưu được dữ liệu cục bộ (bộ nhớ có thể đã đầy).', 'bad'); }
}
function reset() {
  if (typeof confirm === 'function' && !confirm('Xóa toàn bộ tiến độ học tập, ghi chú và dữ liệu cá nhân trên máy này? Thao tác không hoàn tác được.')) return;
  data = JSON.parse(JSON.stringify(defaultData));
  save();
  G.UI.toast('Đã xóa toàn bộ dữ liệu học tập.');
  if (G.App && G.App.render) G.App.render();
}
function exportJSON() {
  if (typeof document === 'undefined') { G.UI.toast('Xuất tệp chỉ khả dụng trong trình duyệt.', 'warn'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ontap-toan-ly-12-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  G.UI.toast('Đã xuất dữ liệu học tập.');
}
function importJSON(file) {
  const r = new FileReader();
  r.onload = function () {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d !== 'object' || !d.attempts) throw new Error('Sai định dạng');
      data = Object.assign(JSON.parse(JSON.stringify(defaultData)), d);
      save();
      G.UI.toast('Đã nhập dữ liệu học tập.');
      G.App.render();
    } catch (e) { G.UI.toast('Tệp không hợp lệ: ' + e.message, 'bad'); }
  };
  r.readAsText(file);
}

const Store = {
  save: save, reset: reset, exportJSON: exportJSON, importJSON: importJSON,
  data: function () { return data; },
  settings: {
    get: function (k) { return data.settings[k]; },
    set: function (k, v) { data.settings[k] = v; save(); },
    setDark: function (on) {
      if (typeof document !== 'undefined' && document.body) document.body.classList.toggle('dark', !!on);
      data.settings.dark = !!on; save();
    }
  },
  attempts: {
    all: function (id) { return data.attempts[id] || []; },
    last: function (id) { const a = data.attempts[id]; return a && a.length ? a[a.length - 1] : null; },
    record: function (id, answer, correct, mode, extra) {
      if (!data.attempts[id]) data.attempts[id] = [];
      const rec = { answer: answer, correct: correct, at: Date.now(), mode: mode || 'practice' };
      if (extra && typeof extra === 'object') Object.assign(rec, extra);
      data.attempts[id].push(rec);
      if (correct) data.status[id] = 'mastered'; else data.status[id] = 'learning';
      save();
      return rec;
    },
    wrongCount: function (id) { return (data.attempts[id] || []).filter(function (a) { return !a.correct; }).length; }
  },
  understood: {
    mark: function (id, v) { data.understood[id] = v !== false; save(); },
    get: function (id) { return !!data.understood[id]; }
  },
  flagged: {
    toggle: function (id) { data.flagged[id] = !data.flagged[id]; save(); return !!data.flagged[id]; },
    get: function (id) { return !!data.flagged[id]; },
    ids: function () { return Object.keys(data.flagged).filter(function (k) { return data.flagged[k]; }); }
  },
  theory: {
    mark: function (lessonId, status) { data.theoryStatus[lessonId] = status; save(); },
    get: function (lessonId) { return data.theoryStatus[lessonId] || 'new'; },
    flag: function (lessonId, v) { data.theoryFlagged[lessonId] = v !== false; save(); },
    flaggedIds: function () { return Object.keys(data.theoryFlagged).filter(function (k) { return data.theoryFlagged[k]; }); },
    bookmark: function (lessonId) { data.bookmarks[lessonId] = !data.bookmarks[lessonId]; save(); return !!data.bookmarks[lessonId]; },
    bookmarkedIds: function () { return Object.keys(data.bookmarks).filter(function (k) { return data.bookmarks[k]; }); }
  },
  notes: {
    list: function (key) { return data.notes[key] || []; },
    add: function (key, text) {
      if (!data.notes[key]) data.notes[key] = [];
      data.notes[key].push({ text: text, at: Date.now() });
      save();
    },
    edit: function (key, i, text) { if (data.notes[key] && data.notes[key][i]) { data.notes[key][i].text = text; save(); } },
    remove: function (key, i) { if (data.notes[key]) { data.notes[key].splice(i, 1); save(); } },
    allKeys: function () { return Object.keys(data.notes).filter(function (k) { return data.notes[k].length; }); }
  },
  formulas: {
    save: function (key, title, texStr) { data.formulaSaves[key] = { title: title, tex: texStr, at: Date.now() }; save(); },
    remove: function (key) { delete data.formulaSaves[key]; save(); },
    has: function (key) { return !!data.formulaSaves[key]; },
    all: function () { return Object.keys(data.formulaSaves).map(function (k) { return Object.assign({ key: k }, data.formulaSaves[k]); }); }
  },
  sessions: {
    add: function (s) { data.sessions.unshift(s); data.sessions = data.sessions.slice(0, 60); save(); },
    all: function () { return data.sessions; }
  },
  session: {
    get: function () { return data.currentSession || null; },
    set: function (s) { data.currentSession = s; save(); },
    clear: function () { data.currentSession = null; save(); }
  }
};

G.Store = Store;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="view-overview">
/* ===== MODULE: view-overview (js/views/overview.js) ===== */
/* ============================================================
   VIEW: TRANG TỔNG QUAN HỌC TẬP
   Không dùng điểm số — dùng trạng thái: Cần học / Đang củng cố / Đã nắm vững
   ============================================================ */
(function (G) {
'use strict';

const C = G.CURRICULUM, ML = G.MathLib, S = G.Store, U = G.UI, esc = ML.esc, card = U.card;

/* Trạng thái chủ đề: dựa trên số câu đã làm, đúng lần gần nhất và xác nhận đã hiểu */
function topicState(subject, topicId) {
  const qs = ML.Bank.filter({ subject: subject, topicId: topicId });
  if (!qs.length) return 'nodata';
  let done = 0, correct = 0, wrong = 0, understood = 0;
  qs.forEach(function (q) {
    const a = S.attempts.all(q.id);
    if (!a.length) return;
    done++;
    if (a[a.length - 1].correct) correct++; else wrong++;
    if (S.understood.get(q.id)) understood++;
  });
  if (done === 0) return 'new';
  if (wrong === 0 && correct === qs.length && understood >= Math.ceil(qs.length / 2)) return 'mastered';
  return 'learning';
}
const STATE_TEXT = { new: 'Cần học', learning: 'Đang củng cố', mastered: 'Đã nắm vững', nodata: 'Chưa có câu hỏi' };

function view() {
  const doneIds = Object.keys(S.data().attempts);
  const done = doneIds.length;
  const correctLast = doneIds.filter(function (id) { const a = S.attempts.all(id); return a.length && a[a.length - 1].correct; }).length;
  const wrongLast = done - correctLast;
  const u = S.data().understood;
  const understoodCount = Object.keys(u).filter(function (k) { return u[k] && S.attempts.all(k).length; }).length;
  const notUnderstood = Object.keys(u).filter(function (k) { return u[k] === false && S.attempts.all(k).length; }).length;
  const flagged = S.flagged.ids().length;
  const allLessons = C.allLessons();
  const tMastered = allLessons.filter(function (l) { return S.theory.get(l.lessonId) === 'mastered'; }).length;

  let h = '';
  h += '<div class="page-head overview-hero"><div><div class="eyebrow">GÓC HỌC TẬP CÁ NHÂN</div><h1>Trang tổng quan học tập</h1>' +
       '<p class="muted">Theo dõi tiến độ theo bài học chứ không theo điểm số. Bạn luôn được quyền ôn lại bất kỳ chủ đề nào.</p></div>' +
       '<div class="overview-actions"><a class="btn btn--primary" href="#/practice?subject=toan&random=1">Luyện nhanh Toán</a>' +
       '<a class="btn" href="#/practice?subject=ly&random=1">Luyện nhanh Vật lí</a><a class="btn btn--ghost" href="#/search">Tìm nội dung</a></div></div>';

  h += '<div class="grid grid--4">' +
    stat(ML.Bank.all().length, 'Câu hỏi trong ngân hàng') +
    stat(done, 'Câu đã từng làm') +
    stat(flagged, 'Câu đã đánh dấu ôn') +
    stat(notUnderstood, 'Câu báo "chưa hiểu"') +
    '</div>';
  const generatedStats = G.GENERATED_BANK_STATS || { generatedToan: 0, generatedLy: 0 };
  const generatedCount = generatedStats.generatedToan + generatedStats.generatedLy;
  const originalCount = Math.max(0, ML.Bank.all().length - generatedCount);
  h += '<p class="muted small bank-provenance">Ngân hàng gồm <b>' + generatedCount.toLocaleString('vi-VN') + '</b> biến thể sinh tự động từ mẫu tham số và <b>' + originalCount.toLocaleString('vi-VN') + '</b> câu dữ liệu ban đầu. Các biến thể có thể dùng chung cấu trúc kiến thức; hãy rà soát trước khi sử dụng cho bài kiểm tra chính thức.</p>';
  h += '<div class="grid grid--2">' +
    card('Trạng thái trả lời', '' +
      '<ul class="kv">' +
      kv('Đúng ở lần gần nhất', correctLast + ' câu', 'ok') +
      kv('Chưa đúng ở lần gần nhất', wrongLast + ' câu', 'bad') +
      kv('Đã xác nhận "tôi đã hiểu"', understoodCount + ' câu', 'ok') +
      '</ul>' +
      '<p class="muted small">Đây là trạng thái học tập, không phải điểm số. Một câu trả lời đúng chưa chứng tỏ đã thành thạo — hãy thử câu tương tự để kiểm chứng.</p>' +
      '<div class="btn-row"><a class="btn btn--primary" href="#/review?kind=wrong">Ôn lại câu làm sai</a>' +
      '<a class="btn" href="#/review?kind=notunderstood">Câu chưa hiểu</a>' +
      '<a class="btn" href="#/review?kind=flagged">Câu đã đánh dấu</a></div>') +
    card('Học liệu lý thuyết', '' +
      '<ul class="kv">' +
      kv('Bài đã đọc', theoryTouchedCount() + '/' + allLessons.length + ' bài') +
      kv('Bài ghi nhận "Đã hiểu"', tMastered + ' bài') +
      kv('Bài cần ôn lại', S.theory.flaggedIds().length + ' bài') +
      kv('Bài đã đánh dấu trang', S.theory.bookmarkedIds().length + ' bài') +
      '</ul>' +
      '<p class="muted small">Chủ đề chỉ được xem là "Đã nắm vững" khi bạn làm đúng các câu của chủ đề đó và tự xác nhận đã hiểu.</p>' +
      '<div class="btn-row"><a class="btn btn--primary" href="#/theory">Vào ôn tập lý thuyết</a>' +
