      '<a href="#/practice?subject=toan">luyện tập Toán 12</a> hoặc <a href="#/practice?subject=ly">luyện tập Vật lí 12</a>.</p>');
  } else {
    h += card('Nên ôn tiếp theo',
      '<div class="list">' + next.map(function (n) {
        return '<a class="list__item" href="' + n.href + '">' +
          '<div class="list__main"><div class="list__title">' + esc(n.title) + '</div>' +
          '<div class="list__sub">' + esc(n.sub) + '</div></div>' +
          '<div class="list__meta">' + U.chip(n.tag, n.kind) + '</div></a>';
      }).join('') + '</div>',
      { headExtra: '<span class="muted small">ưu tiên câu sai nhiều lần và câu chưa xác nhận đã hiểu</span>' });
  }

  ['toan', 'ly'].forEach(function (subj) {
    const sub = C.getSubject(subj);
    let rows = '';
    sub.semesters.forEach(function (sem) {
      sem.chapters.forEach(function (ch) {
        const topics = C.allTopics().filter(function (t) { return t.chapterId === ch.id; });
        const stats = topics.map(function (t) { return topicState(subj, t.topicId); });
        const total = topics.length || 1;
        const mastered = stats.filter(function (s) { return s === 'mastered'; }).length;
        const learning = stats.filter(function (s) { return s === 'learning'; }).length;
        const nodata = stats.filter(function (s) { return s === 'nodata'; }).length;
        const pct = Math.round(mastered / total * 100);
        rows += '<tr><td><a href="#/theory?subject=' + subj + '&chapter=' + ch.id + '">' + esc(ch.name) + '</a>' +
          '<div class="muted small">' + sem.name + ' · ' + topics.length + ' chủ đề' + (nodata ? ' · ' + nodata + ' chưa có câu hỏi' : '') + '</div></td>' +
          '<td class="num">' + mastered + '/' + topics.length + '</td>' +
          '<td class="num">' + learning + '</td>' +
          '<td><div class="bar" title="' + pct + '% chủ đề đã nắm vững"><div class="bar__fill" style="width:' + pct + '%"></div></div></td></tr>';
      });
    });
    h += card(sub.name + ' — tiến độ theo chương',
      '<table class="table"><thead><tr><th>Chương</th><th class="num">Đã nắm</th><th class="num">Đang củng cố</th><th>Mức độ</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<p class="muted small">Cách xác định trạng thái: "Đã nắm vững" khi bạn làm đúng tất cả câu của chủ đề và xác nhận đã hiểu ít nhất một nửa số câu.</p>',
      { flush: true, bodyClass: 'card__body card__body--table' });
  });
  return h;
}
function stat(v, l) {
  return '<div class="stat"><div class="stat__value">' + v + '</div><div class="stat__label">' + esc(l) + '</div></div>';
}
function kv(k, v, kind) {
  return '<li class="kv__row"><span>' + esc(k) + '</span><b class="' + (kind ? 'tx-' + kind : '') + '">' + esc(String(v)) + '</b></li>';
}
function theoryTouchedCount() {
  return C.allLessons().filter(function (l) { const s = S.theory.get(l.lessonId); return s === 'mastered' || s === 'learning'; }).length;
}
function suggestNext() {
  const out = [];
  const score = {};
  const all = ML.Bank.all();
  Object.keys(S.data().attempts).forEach(function (id) {
    const q = all.find(function (x) { return x.id === id; });
    if (!q) return;
    const a = S.attempts.all(id);
    const wrongs = a.filter(function (x) { return !x.correct; }).length;
    if (S.data().understood[id] === false) score[id] = 100 + wrongs * 10;
    else if (wrongs > 0) score[id] = 50 + wrongs * 10;
    else if (!S.understood.get(id)) score[id] = 20;
  });
  S.flagged.ids().forEach(function (id) { score[id] = (score[id] || 0) + 30; });
  Object.keys(score).sort(function (a, b) { return score[b] - score[a]; }).slice(0, 8).forEach(function (id) {
    const q = all.find(function (x) { return x.id === id; });
    if (!q) return;
    const les = C.getLesson(q.lessonId);
    const tp = C.getTopic(q.topicId);
    const notUnd = S.data().understood[id] === false;
    out.push({
      title: (les ? les.name : q.lessonId) + (tp ? ' — ' + tp.name : ''),
      sub: notUnd ? 'Bạn đã báo "chưa hiểu" sau khi xem lời giải' : 'Câu này từng làm sai hoặc chưa xác nhận đã hiểu',
      href: '#/question?id=' + id + '&mode=review',
      tag: notUnd ? 'Cần ôn gấp' : 'Cần ôn',
      kind: notUnd ? 'bad' : 'warn'
    });
  });
  return out;
}

G.VIEWS = G.VIEWS || {};
G.VIEWS.overview = view;
G.TopicState = { get: topicState, text: STATE_TEXT };

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="view-theory">
/* ===== MODULE: view-theory (js/views/theory.js) ===== */
/* ============================================================
   VIEW: ÔN TẬP LÝ THUYẾT
   - /theory            : chọn môn → chương → bài
   - /theory/lesson     : trang đọc chi tiết một bài
   ============================================================ */
(function (G) {
'use strict';

const C = G.CURRICULUM, ML = G.MathLib, S = G.Store, U = G.UI, T = G.THEORY || {}, esc = ML.esc;

function subjectSelect(active) {
  return '<div class="segment" role="tablist" aria-label="Chọn môn học">' +
    ['toan', 'ly'].map(function (s) {
      return '<button class="segment__btn' + (s === active ? ' is-active' : '') + '" role="tab" ' +
        'aria-selected="' + (s === active) + '" data-route="#/theory?subject=' + s + '">' +
        C.getSubject(s).name + '</button>';
    }).join('') + '</div>';
}

/* ---------- Danh sách chương/bài/chủ đề ---------- */
function listView(params) {
  const subject = params.subject === 'ly' ? 'ly' : 'toan';
  const sub = C.getSubject(subject);
  const topicCount = ML.Bank.countByTopic(subject);
  let h = '';
  h += '<div class="page-head"><h1>Ôn tập lý thuyết</h1>' +
       '<p class="muted">Học theo bộ sách ' + esc(sub.book) + '. Mỗi bài gồm mục tiêu, kiến thức cốt lõi, công thức, ví dụ từng bước, lỗi thường gặp và câu tự kiểm tra.</p></div>';
  h += subjectSelect(subject);

  sub.semesters.forEach(function (sem) {
    sem.chapters.forEach(function (ch) {
      let lessons = '';
      ch.lessons.forEach(function (les) {
        const th = T[les.id];
        const st = S.theory.get(les.id);
        const qCount = (les.topics || []).reduce(function (n, t) { return n + (topicCount[t.id] || 0); }, 0);
        const flagged = S.theory.flaggedIds().indexOf(les.id) >= 0;
        const bm = S.theory.bookmarkedIds().indexOf(les.id) >= 0;
        lessons += '<a class="les" href="#/theory/lesson?id=' + les.id + '">' +
          '<div class="les__icon">' + iconSvg('book') + '</div>' +
          '<div class="les__main">' +
          '<div class="les__title">' + esc(les.name) + (bm ? ' <span class="tag tag--info" title="Đã đánh dấu trang">★</span>' : '') + (flagged ? ' <span class="tag tag--warn" title="Cần ôn lại">⟳</span>' : '') + '</div>' +
          '<div class="les__sub">' + (les.topics || []).map(function (t) { return esc(t.name); }).join(' · ') + '</div>' +
          '<div class="les__meta">' + U.chip(stateChipText(st), stateChipKind(st)) +
          (qCount ? U.chip(qCount + ' câu luyện tập', 'neutral') : U.chip('chưa có câu hỏi', 'warn')) +
          (th ? '' : U.chip('học liệu đang biên soạn', 'warn')) +
          '</div></div>' +
          '<div class="les__go">' + iconSvg('arrow') + '</div></a>';
      });
      h += U.card('<span class="chip-id">' + esc(ch.name) + '</span>', '<div class="list list--lessons">' + lessons + '</div>',
        { headExtra: '<span class="muted small">' + sem.name + '</span>' });
    });
  });
  return h;
}
function stateChipText(st) { return st === 'mastered' ? 'Đã hiểu' : (st === 'learning' ? 'Đang ôn' : 'Chưa học'); }
function stateChipKind(st) { return st === 'mastered' ? 'ok' : (st === 'learning' ? 'info' : 'neutral'); }
/* ---------- Trang đọc chi tiết một bài ---------- */
function lessonView(params) {
  const id = params.id;
  const les = C.getLesson(id);
  if (!les) return G.VIEWS.notFound('Không tìm thấy bài học', 'Bài học "' + esc(id) + '" không tồn tại trong mục lục.', '#/theory');
  const th = T[id];
  const st = S.theory.get(id);
  const qs = ML.Bank.filter({ lessonId: id });
  const flagged = S.theory.flaggedIds().indexOf(id) >= 0;
  const bm = S.theory.bookmarkedIds().indexOf(id) >= 0;

  let h = '';
  h += '<nav class="crumbs"><a href="#/theory?subject=' + les.subjectId + '">Ôn tập lý thuyết</a>' +
       '<span>/</span><a href="#/theory?subject=' + les.subjectId + '&chapter=' + les.chapterId + '">' + esc(les.chapterName) + '</a>' +
       '<span>/</span><b>' + esc(les.name) + '</b></nav>';
  h += '<div class="page-head"><h1>' + esc(les.name) + '</h1>' +
       '<p class="muted">' + esc(les.chapterName) + (les.semesterName ? ' · ' + esc(les.semesterName) : '') +
       ' — Bộ sách ' + esc(C.getSubject(les.subjectId).book) + '</p></div>';

  /* Thanh hành động của bài */
  h += '<div class="toolbar card card--flush"><div class="card__body card__body--tools">' +
    '<div class="toolbar__state">' + U.chip('Trạng thái: ' + stateChipText(st), stateChipKind(st)) +
    (flagged ? U.chip('Cần ôn lại', 'warn') : '') + '</div>' +
    '<div class="toolbar__actions">' +
    '<button class="btn btn--sm" data-act="bookmark" data-id="' + id + '">' + (bm ? 'Bỏ đánh dấu trang' : 'Đánh dấu trang') + '</button>' +
    '<button class="btn btn--sm" data-act="needReview" data-id="' + id + '">' + (flagged ? 'Bỏ "cần ôn lại"' : 'Cần ôn lại') + '</button>' +
    '<button class="btn btn--sm" data-act="understood" data-id="' + id + '">Đã hiểu</button>' +
    '<a class="btn btn--sm" href="#/theory/lesson?id=' + id + '#flash">Thẻ ghi nhớ</a>' +
    (qs.length ? '<a class="btn btn--sm btn--primary" href="#/practice?lesson=' + id + '">Luyện tập bài này (' + qs.length + ' câu)</a>' : '') +
    '</div></div></div>';

  if (!th) {
    h += U.card('Học liệu đang được biên soạn',
      '<p>Chủ đề này đã có trong mục lục của bộ sách <b>' + esc(C.getSubject(les.subjectId).book) + '</b> nhưng phần lý thuyết chi tiết chưa hoàn thiện.</p>' +
      '<ul>' + (les.topics || []).map(function (t) { return '<li>' + esc(t.name) + '</li>'; }).join('') + '</ul>' +
      (qs.length ? '<p>Bạn vẫn có thể luyện tập: <a href="#/practice?lesson=' + id + '">' + qs.length + ' câu hỏi</a> — mỗi câu đều có lời giải đầy đủ.</p>'
                 : '<p class="muted">Ngân hàng câu hỏi cho bài này cũng chưa có. Đây là phần còn thiếu, được ghi nhận trung thực thay vì hiển thị nội dung giả.</p>'),
      {});
    return h;
  }
  /* 1. Mục tiêu */
  h += U.card('Mục tiêu cần đạt', '<ol class="goals">' + th.goal.map(function (g) { return '<li>' + g + '</li>'; }).join('') + '</ol>');

  /* 2. Kiến thức cốt lõi */
  h += U.card('Kiến thức cốt lõi', '<ul class="know">' + th.core.map(function (k) { return '<li>' + k + '</li>'; }).join('') + '</ul>');

  /* 3. Định nghĩa & khái niệm */
  if (th.defs && th.defs.length) {
    h += U.card('Định nghĩa và khái niệm quan trọng', '<div class="knowgrid">' + th.defs.map(function (c) {
      return '<div class="knowcard"><div class="knowcard__term">' + c.t + '</div><div class="knowcard__text">' + c.d + '</div></div>';
    }).join('') + '</div>');
  }

  /* 4. Công thức, ký hiệu, điều kiện */
  if (th.formulas && th.formulas.length) {
    h += U.card('Công thức, ký hiệu và điều kiện áp dụng', th.formulas.map(function (f, i) {
      const key = id + ':f' + i;
      return '<div class="formula">' +
        '<div class="formula__name">' + esc(f.t) +
          '<button class="btn btn--sm btn--ghost" data-act="saveFormula" data-key="' + key + '" data-tex="' + esc(f.f) + '" data-title="' + esc(f.t) + '" title="Lưu vào sổ tay">' +
          (S.formulas.has(key) ? '✓ Đã lưu' : 'Lưu vào sổ tay') + '</button></div>' +
        '<div class="formula__tex" data-tex="' + esc(f.f) + '" data-display="1"></div>' +
        (f.note ? '<div class="formula__note">' + f.note + '</div>' : '') + '</div>';
    }).join(''), {});
  }

  /* 5. Ý nghĩa đại lượng */
  if (th.meanings && th.meanings.length) {
    h += U.card('Ý nghĩa các đại lượng và đơn vị',
      '<table class="table"><thead><tr><th>Ký hiệu</th><th>Ý nghĩa</th></tr></thead><tbody>' +
      th.meanings.map(function (m) {
        return '<tr><td class="sym"><span data-tex="' + esc(m.s) + '"></span></td><td>' + m.m + '</td></tr>';
      }).join('') + '</tbody></table>', { flush: true, bodyClass: 'card__body card__body--table' });
  }

  /* 6. Quy tắc / định lý cần nhớ */
  if (th.rules && th.rules.length) {
    h += U.card('Quy tắc, định lý hoặc tính chất cần nhớ',
      '<ul class="know">' + th.rules.map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul>');
  }

  /* 7. Ví dụ minh họa từng bước */
  if (th.examples && th.examples.length) {
    h += U.card('Ví dụ minh họa được giải từng bước', th.examples.map(function (ex) {
      return '<div class="ex"><p class="ex-title"><b>' + ex.q + '</b></p><ol class="steps">' +
        ex.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>';
    }).join(''));
  }

  /* 8. Lỗi sai thường gặp */
  if (th.mistakes && th.mistakes.length) {
    h += U.card('Các lỗi sai thường gặp',
      '<ul class="pitfall">' + th.mistakes.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>');
  }

  /* 9. Mẹo nhận diện dạng bài */
  if (th.tips && th.tips.length) {
    h += U.card('Mẹo nhận biết dạng bài và chọn phương pháp giải',
      '<ul class="tips">' + th.tips.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>');
  }

  /* 9. Thẻ ghi nhớ */
  if (th.flashcards && th.flashcards.length) {
    h += U.card('Thẻ ghi nhớ (flashcard)',
      '<div class="grid grid--3" id="flash">' + th.flashcards.map(function (f, i) {
        return '<div class="flash" data-act="flip" tabindex="0" role="button" aria-expanded="false">' +
          '<div class="flash__face flash__face--front"><span class="flash__label">Câu hỏi</span>' + f.front + '</div>' +
          '<div class="flash__face flash__face--back"><span class="flash__label">Đáp án</span>' + f.back +
          '<span class="flash__hint">Nhấn để lật lại</span></div></div>';
      }).join('') + '</div>', { headExtra: '<span class="muted small">nhấn vào thẻ để xem đáp án</span>' });
  }

  /* 10. Tóm tắt cuối bài */
  h += U.card('Tóm tắt cuối bài',
    Array.isArray(th.summary)
      ? '<ul class="summary">' + th.summary.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>'
      : '<p class="summary">' + th.summary + '</p>');

  /* 11. Câu hỏi tự kiểm tra */
  if (th.selfCheck && th.selfCheck.length) {
    h += U.card('Tự kiểm tra sau khi học',
      th.selfCheck.map(function (s, i) {
        if (typeof s === 'string') {
          return '<div class="selfq"><div class="selfq__q">' + (i + 1) + '. ' + s + '</div>' +
            '<p class="muted small">Hãy tự trả lời ra giấy hoặc suy nghĩ trong đầu, rồi đối chiếu với phần Tóm tắt và Kiến thức cốt lõi ở trên.</p></div>';
        }
        return '<div class="selfq"><div class="selfq__q">' + (i + 1) + '. ' + (s.q || '') + '</div>' +
          '<button class="btn btn--sm btn--ghost" data-act="reveal">Hiện đáp án</button>' +
          '<div class="selfq__a" hidden>' + (s.a || '') + '</div></div>';
      }).join('') + '</div>');
  }

  /* 12. Ghi chú cá nhân + điều hướng */
  h += U.card('Ghi chú của bạn cho bài này',
    '<form class="note-form" data-act="noteForm" data-key="' + id + '">' +
    '<textarea name="text" rows="3" placeholder="Ví dụ: mình hay nhầm cực đại với cực tiểu khi xét dấu đạo hàm..."></textarea>' +
    '<button class="btn btn--sm" type="submit">Lưu ghi chú</button></form>' + renderNotes(id));

  const nextLesson = nextInChapter(les);
  h += '<div class="btn-row btn-row--end">' +
    (qs.length ? '<a class="btn btn--primary" href="#/practice?lesson=' + id + '">Luyện tập bài này →</a>' : '') +
    (nextLesson ? '<a class="btn" href="#/theory/lesson?id=' + nextLesson.id + '">Bài tiếp theo: ' + esc(nextLesson.name) + ' →</a>' : '') +
    '</div>';
  return h;
}

/* ---------- Hàm phụ trợ ---------- */
function renderNotes(key) {
  const list = S.notes.list(key);
  if (!list.length) return '<p class="muted small">Chưa có ghi chú.</p>';
  return '<ul class="notes">' + list.map(function (n, i) {
    return '<li><div class="notes__text">' + esc(n.text) + '</div>' +
      '<div class="notes__meta"><span class="muted small">' + U.fmtDate(n.at) + '</span>' +
      '<button class="btn btn--sm btn--ghost" data-act="noteEdit" data-key="' + key + '" data-i="' + i + '">Sửa</button>' +
      '<button class="btn btn--sm btn--ghost" data-act="noteDel" data-key="' + key + '" data-i="' + i + '">Xóa</button></div></li>';
  }).join('') + '</ul>';
}
function nextInChapter(les) {
  const all = C.allLessons().filter(function (l) { return l.chapterId === les.chapterId; });
  const i = all.findIndex(function (l) { return l.lessonId === les.lessonId; });
  return i >= 0 && i + 1 < all.length ? all[i + 1] : null;
}
function iconSvg(name) {
  const p = {
    book: '<path d="M4 4h6a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M17 7a3 3 0 0 1 3 3v10H10"/>',
    arrow: '<path d="M9 6l6 6-6 6"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (p[name] || '') + '</svg>';
}

G.VIEWS = G.VIEWS || {};
G.VIEWS.theoryList = listView;
G.VIEWS.theoryLesson = lessonView;
G.VIEWS.renderNotes = renderNotes;
G.VIEWS.theory = listView;
G.VIEWS.lesson = lessonView;

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="view-practice">
/* ===== MODULE: view-practice (js/views/practice.js) ===== */
/* ============================================================
   VIEW: LUYỆN TẬP ỨNG DỤNG
   - /practice       : chọn môn, chương, bài, chủ đề, mức độ, chế độ
   - /practice/run   : làm bài (session)
   - /question       : 1 câu + giải thích đầy đủ
   ============================================================ */
(function (G) {
'use strict';

const C = G.CURRICULUM, ML = G.MathLib, S = G.Store, U = G.UI, esc = ML.esc;

function notFound(title, desc, back) {
  return U.card(title, '<p>' + desc + '</p><a class="btn btn--primary" href="' + (back || '#/overview') + '">Quay lại</a>');
}

function subjectSelect(active) {
  return '<div class="segment" role="tablist" aria-label="Chọn môn học">' +
    ['toan', 'ly'].map(function (s) {
      return '<button class="segment__btn' + (s === active ? ' is-active' : '') + '" role="tab" ' +
        'aria-selected="' + (s === active) + '" data-route="#/practice?subject=' + s + '">' +
        C.getSubject(s).name + '</button>';
    }).join('') + '</div>';
}

function setupView(params) {
  const subject = params.subject === 'ly' ? 'ly' : 'toan';
  const sub = C.getSubject(subject);
  const cog = params.cog || 'ALL';
  const chapterId = params.chapter || '';
  const lessonId = params.lesson || '';
  const topicId = params.topic || '';
  const mode = params.mode || 'mixed';

  /* Nút ngẫu nhiên khởi tạo một phiên thật, không chỉ đổi bộ lọc. */
  if (params.random === '1') {
    const randomList = ML.Bank.shuffle(ML.Bank.filter({ subject: subject })).slice(0, 10);
    if (randomList.length) {
      const ids = randomList.map(function (q) { return q.id; });
      G.Session.set({ ids: ids, index: 0, subject: subject, label: '10 câu ngẫu nhiên', at: Date.now() });
      S.sessions.add({ id: 's' + Date.now(), subject: subject, ids: ids, at: Date.now(), label: '10 câu ngẫu nhiên', filters: { subject: subject, random: true } });
      return G.VIEWS.run({});
    }
  }

  let h = '';
  h += '<div class="page-head"><h1>Luyện tập ứng dụng</h1>' +
       '<p class="muted">Làm bài từ dễ đến khó. Sau mỗi câu, bạn luôn nhận được giải thích đầy đủ — dù trả lời đúng hay sai.</p></div>';
  h += subjectSelect(subject);

  let chOpts = '<option value="">Tất cả chương</option>';
  sub.semesters.forEach(function (sem) {
    sem.chapters.forEach(function (ch) {
      chOpts += '<option value="' + ch.id + '"' + (chapterId === ch.id ? ' selected' : '') + '>' + esc(ch.name) + '</option>';
    });
  });
  let lesOpts = '<option value="">Tất cả bài</option>';
  C.allLessons().filter(function (l) { return l.subjectId === subject && (!chapterId || l.chapterId === chapterId); })
    .forEach(function (l) {
      const n = ML.Bank.filter({ lessonId: l.lessonId }).length;
      lesOpts += '<option value="' + l.lessonId + '"' + (lessonId === l.lessonId ? ' selected' : '') + '>' +
        esc(l.name) + (n ? ' (' + n + ')' : ' (0)') + '</option>';
    });
  const cogOpts = '<option value="ALL">Tất cả mức độ</option>' +
    ['NB', 'TH', 'VD', 'VDC'].map(function (k) {
      return '<option value="' + k + '"' + (cog === k ? ' selected' : '') + '>' + U.COG_LABEL[k] + '</option>';
    }).join('');
  let topicOpts = '<option value="">Tất cả chủ đề</option>';
  C.allTopics().filter(function (t) {
    return t.subjectId === subject && (!chapterId || t.chapterId === chapterId) && (!lessonId || t.lessonId === lessonId);
  }).forEach(function (t) {
    const n = ML.Bank.filter({ topicId: t.topicId }).length;
    topicOpts += '<option value="' + t.topicId + '"' + (topicId === t.topicId ? ' selected' : '') + '>' + esc(t.name) + ' (' + n + ' câu)</option>';
  });

  h += U.card('Chọn nội dung luyện tập',
    '<form id="setupForm" class="setup">' +
    '<div class="setup__row"><label>Môn<select name="subject">' +
      ['toan', 'ly'].map(function (s) { return '<option value="' + s + '"' + (s === subject ? ' selected' : '') + '>' + C.getSubject(s).name + '</option>'; }).join('') +
      '</select></label>' +
    '<label>Chương<select name="chapter">' + chOpts + '</select></label>' +
    '<label>Bài học<select name="lesson">' + lesOpts + '</select></label></div>' +
    '<div class="setup__row"><label>Chủ đề<select name="topic">' + topicOpts + '</select></label>' +
    '<label>Mức độ nhận thức<select name="cog">' + cogOpts + '</select></label>' +
    '<label>Số câu<select name="count">' +
      [5, 8, 10, 15, 20, 0].map(function (n) { return '<option value="' + n + '">' + (n === 0 ? 'Tất cả câu phù hợp' : n + ' câu') + '</option>'; }).join('') +
      '</select></label>' +
    '<label>Chế độ<select name="mode"><option value="mixed"' + (mode === 'mixed' ? ' selected' : '') + '>Hỗn hợp (xếp từ dễ đến khó)</option>' +
      '<option value="level"' + (mode === 'level' ? ' selected' : '') + '>Luyện theo từng mức độ</option></select></label></div>' +
    '<div class="setup__actions"><button class="btn btn--primary" type="submit">Bắt đầu luyện tập</button>' +
    '<button class="btn" type="button" data-route="#/practice?subject=' + subject + '&random=1">Chọn ngẫu nhiên 10 câu</button></div>' +
    '</form>' + coverageNote(subject, { chapterId: chapterId, lessonId: lessonId, topicId: topicId, cog: cog }));
  return h;
}
/* Ghi rõ mức độ bao phủ thực tế, trung thực khi thiếu câu */
function coverageNote(subject, f) {
  const list = ML.Bank.filter({ subject: subject, chapterId: f.chapterId || null, lessonId: f.lessonId || null, topicId: f.topicId || null, cognitive: f.cog || null });
  if (!list.length) {
    return U.card('Khu vực này chưa có câu hỏi',
      '<p>Phạm vi bạn chọn chưa được biên soạn câu hỏi. Bạn có thể chọn phạm vi khác hoặc xem ' +
      '<a href="#/theory?subject=' + subject + '">lý thuyết</a> để học trước.</p>' +
      '<p class="muted small">Các bài chưa có câu hỏi được thể hiện rõ ở trang tổng quan. Chúng tôi không tạo câu hỏi giả để lấp chỗ trống.</p>');
  }
  const byCog = {}, byType = {};
  list.forEach(function (q) { byCog[q.cognitive] = (byCog[q.cognitive] || 0) + 1; byType[q.type] = (byType[q.type] || 0) + 1; });
  return U.card('Có ' + list.length + ' câu phù hợp',
    '<div class="cov">' + ['NB', 'TH', 'VD', 'VDC'].map(function (k) {
      return '<div class="cov__item"><b>' + (byCog[k] || 0) + '</b><span>' + U.COG_LABEL[k] + '</span></div>';
    }).join('') + '</div>' +
    '<div class="bank-types">' + [['mc1','Một đáp án'],['mcq','Nhiều đáp án'],['tf','Đúng / Sai'],['short','Trả lời ngắn'],['numeric','Điền số']].map(function (x) { return '<span><b>' + (byType[x[0]] || 0) + '</b> ' + x[1] + '</span>'; }).join('') + '</div>' +
    '<p class="muted small">Bạn được quyền bắt đầu từ bất kỳ mức nào, không bị ép tăng độ khó chỉ vì đã trả lời đúng một vài câu.</p>',
    { headExtra: '<span class="muted small">mức độ bao phủ thực tế</span>' });
}

/* ---------- Màn hình làm bài ---------- */
function runView(params) {
  let sess = G.Session.get();
  if (!sess || !sess.ids.length) {
    return U.empty('Chưa có phiên luyện tập', 'Hãy chọn chương, bài hoặc chủ đề để bắt đầu.',
      '<a class="btn btn--primary" href="#/practice?subject=toan">Bắt đầu luyện tập</a>');
  }
  if (params.next) {
    sess.index = Math.min(sess.index + 1, sess.ids.length);
    G.Session.set(sess);
  }
  if (params.done || sess.index >= sess.ids.length) return summaryView(sess);
  const id = sess.ids[sess.index];
  return G.VIEWS.question({ id: id, mode: params.mode || 'practice', session: true, index: sess.index, total: sess.ids.length });
}

/* ---------- Tổng kết phiên ---------- */
function summaryView(sess) {
  const res = sess.ids.map(function (id) {
    const q = ML.Bank.all().find(function (x) { return x.id === id; });
    const last = S.attempts.last(id);
    return { q: q, ok: !!(last && last.correct) };
  });
  const right = res.filter(function (r) { return r.ok; }).length;
  let h = '';
  h += '<div class="page-head"><h1>Kết thúc phiên luyện tập</h1>' +
       '<p class="muted">Bạn đã làm ' + res.length + ' câu, trong đó ' + right + ' câu trả lời đúng ở lần gần nhất. ' +
       'Đây chỉ là trạng thái học tập để bạn biết cần ôn gì tiếp theo, không phải điểm số.</p></div>';
  const need = res.filter(function (r) { return !r.ok; });
  if (need.length) {
    h += U.card('Nên ôn lại những câu sau',
      '<div class="list">' + need.map(function (r) {
        const les = C.getLesson(r.q.lessonId);
        return '<a class="list__item" href="#/question?id=' + r.q.id + '&mode=review">' +
          '<div class="list__main"><div class="list__title">' + esc(les ? les.name : r.q.lessonId) + '</div>' +
          '<div class="list__sub">' + esc(C.getTopic(r.q.topicId) ? C.getTopic(r.q.topicId).name : '') + ' · ' + U.COG_LABEL[r.q.cognitive] + '</div></div>' +
          '<div class="list__meta">' + U.chip('Làm lại', 'bad') + '</div></a>';
      }).join('') + '</div>');
  } else {
    h += U.card('Tất cả câu trong phiên này đã đúng ở lần gần nhất',
      '<p>Hãy kiểm tra lại bằng cách xem lời giải của từng câu và xác nhận "tôi đã hiểu" — làm đúng chưa chắc đã hiểu sâu.</p>');
  }
  h += '<div class="btn-row"><a class="btn btn--primary" href="#/practice?subject=' + (res[0] ? res[0].q.subject : 'toan') + '">Luyện tiếp</a>' +
       '<a class="btn" href="#/history">Xem lịch sử luyện tập</a>' +
       '<a class="btn" href="#/overview">Về trang tổng quan</a></div>';
  return h;
}

G.VIEWS = G.VIEWS || {};
G.VIEWS.practice = setupView;
G.VIEWS.practiceSetup = setupView;
G.VIEWS.run = runView;
G.VIEWS.summary = summaryView;
G.VIEWS.notFound = notFound;

G.Session = {
  get: function () { return S.session.get(); },
  set: function (s) { S.session.set(s); },
  clear: function () { S.session.clear(); }
};

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="view-question">
/* ===== MODULE: view-question (js/views/question.js) ===== */
/* ============================================================
   VIEW: CÂU HỎI & GIẢI THÍCH (mục 6 của yêu cầu)
   A. Kết quả trả lời   B. Đáp án chính xác   C. Vì sao đúng
   D. Vì sao bạn đúng/sai   E. Phân tích từng phương án
   F. Lời giải từng bước   G. Kiến thức cần củng cố   H. Hành động sau
   Không tự động chuyển câu. Không chỉ hiện dấu tích/X.
   ============================================================ */
(function (G) {
'use strict';

const C = G.CURRICULUM, ML = G.MathLib, S = G.Store, U = G.UI, esc = ML.esc;

function findQuestion(id) {
  return ML.Bank.all().find(function (q) { return q.id === id; }) || null;
}

/* ---------- Vùng nhập/chọn đáp án theo loại câu ---------- */
function inputArea(q, disabled) {
  const d = disabled ? ' disabled' : '';
  switch (q.type) {
    case 'mc1':
      return '<ul class="opts" role="radiogroup" aria-label="Các phương án">' +
        q.options.map(function (o, i) {
          return '<li><label class="opt' + (disabled ? ' is-locked' : '') + '">' +
            '<input type="radio" name="ans" value="' + i + '"' + d + '>' +
            '<span class="opt__key">' + 'ABCD'.charAt(i) + '</span>' +
            '<span class="opt__text" data-tex="' + esc(o) + '"></span></label></li>';
        }).join('') + '</ul>';
    case 'mcq':
      return '<ul class="opts" aria-label="Chọn tất cả phương án đúng">' +
        q.options.map(function (o, i) {
          return '<li><label class="opt' + (disabled ? ' is-locked' : '') + '">' +
            '<input type="checkbox" name="ans" value="' + i + '"' + d + '>' +
            '<span class="opt__key">' + 'ABCD'.charAt(i) + '</span>' +
            '<span class="opt__text" data-tex="' + esc(o) + '"></span></label></li>';
        }).join('') + '</ul>' +
        '<p class="muted small">Chọn đầy đủ các phương án đúng. Chọn thừa hoặc thiếu đều bị tính là chưa đúng.</p>';
    case 'tf':
      return '<div class="segment"><label class="opt opt--inline"><input type="radio" name="ans" value="T"' + d + '> <span>Đúng</span></label>' +
        '<label class="opt opt--inline"><input type="radio" name="ans" value="F"' + d + '> <span>Sai</span></label></div>';
    case 'numeric':
      return '<div class="num-input"><input type="text" name="ans" inputmode="decimal" placeholder="Nhập đáp số"' + d + '>' +
        '<span class="num-input__unit">' + esc((q.numeric && q.numeric.unit) || '') + '</span></div>' +
        (q.numeric && q.numeric.unitRequired ? '<p class="muted small">Nhập cả đơn vị vào ô đáp số, ví dụ: <code>12,5 m/s</code>.</p>' : '');
    default:
      return '<input type="text" name="ans" class="text-input" placeholder="Nhập câu trả lời"' + d + '>';
  }
}

/* ---------- Màn hình câu hỏi ---------- */
function view(params) {
  const q = findQuestion(params.id);
  if (!q) {
    return U.card('Không tìm thấy câu hỏi',
      '<p>Câu hỏi "<b>' + esc(params.id || '') + '</b>" không tồn tại trong ngân hàng câu hỏi.</p>' +
      '<a class="btn btn--primary" href="#/practice?subject=toan">Đến luyện tập</a>');
  }
  const tp = C.getTopic(q.topicId);
  const flagged = S.flagged.get(q.id);
  const state = params.checked ? S.attempts.last(q.id) : null;

  let h = '';
  h += '<nav class="crumbs"><a href="#/practice?subject=' + q.subject + '">Luyện tập</a><span>/</span>' +
    '<b title="' + esc(tp ? tp.name : q.topicId) + '">' + esc(tp ? tp.name : q.topicId) + '</b></nav>';

  h += '<section class="qcard">';
  h += '<div class="qcard__meta">' +
    (params.session ? U.chip('Câu ' + (params.index + 1) + '/' + params.total, 'info') : '') +
    U.chip(U.COG_LABEL[q.cognitive] || q.cognitive, q.cognitive === 'VDC' ? 'warn' : 'info') +
    U.chip(U.TYPE_LABEL[q.type], 'neutral') +
    (flagged ? U.chip('Cần ôn lại', 'warn') : '') +
    '</div>';
  /* Đề bài là văn bản có công thức nội tuyến. Không dùng data-display=1 ở đây:
     chế độ display khiến mọi công thức $...$ bị tách thành từng hàng riêng. */
  h += '<div class="qcard__q" data-tex="' + esc(q.question) + '"></div>';
  h += '<form id="answerForm" data-act="answer" data-id="' + q.id + '" data-mode="' + esc(params.mode || 'practice') + '">';
  h += inputArea(q, !!state);
  h += '<div class="qcard__actions">' +
    (state ? '' : '<button class="btn btn--primary" type="submit" data-act="check">Kiểm tra đáp án</button>') +
    '<button class="btn" type="button" data-act="hint" data-id="' + q.id + '">Gợi ý</button>' +
    '<button class="btn" type="button" data-act="flag" data-id="' + q.id + '">' + (flagged ? 'Bỏ đánh dấu' : 'Đánh dấu') + '</button>' +
    '<a class="btn btn--ghost" href="#/theory/lesson?id=' + q.lessonId + '">Lý thuyết</a>' +
    '</div>';
  h += '<div class="hintbox" id="hintBox" hidden><b>Gợi ý:</b> <span data-tex="' + esc(q.hint || '') + '"></span></div>';
  h += '</form>';
  h += '<div id="feedback"></div>';
  if (state) h += explanationHTML(q, state);
  h += '</section>';

  h += '<div class="btn-row btn-row--end">' + nextButtons(q, params) + '</div>';
  return h;
}

function nextButtons(q, params) {
  let h = '';
  const sess = G.Session && G.Session.get();
  if (params.session && sess && sess.ids.length) {
    if (sess.index >= sess.ids.length - 1) {
      h += '<a class="btn btn--primary" href="#/practice/run?done=1">Hoàn thành phiên →</a>';
    } else {
      h += '<a class="btn btn--primary" href="#/practice/run?next=1">Câu tiếp theo →</a>';
    }
  }
  const similar = ML.Bank.filter({ topicId: q.topicId }).filter(function (x) { return x.id !== q.id; });
  if (similar.length) {
    h += '<a class="btn" href="#/question?id=' + ML.Bank.sample(similar, 1)[0].id + '&mode=similar">Làm một câu tương tự</a>';
  }
  h += '<a class="btn" href="#/practice?lesson=' + q.lessonId + '">Ôn lại toàn bộ bài này</a>';
  h += '<a class="btn btn--ghost" href="#/overview">Trang tổng quan</a>';
  return h;
}
/* ============ A + B: kết quả trả lời và đáp án chính xác ============ */
function answerText(q, ans) {
  if (ans === null || ans === undefined || ans === '' || (Array.isArray(ans) && !ans.length)) return '<i>chưa có</i>';
  if (q.type === 'mc1' || q.type === 'mcq') {
    const list = Array.isArray(ans) ? ans : [ans];
    return list.map(function (i) {
      return '<b>' + 'ABCD'.charAt(Number(i)) + '</b>. <span data-tex="' + esc(q.options[Number(i)] || '') + '"></span>';
    }).join('<br>');
  }
  if (q.type === 'tf') return (ans === 'T' || ans === true || ans === 'true') ? 'Đúng' : 'Sai';
  return '<span data-tex="' + esc(String(ans)) + '"></span>';
}

function resultBanner(q, attempt) {
  let kind, stateText;
  if (attempt.state === 'blank') { kind = 'warn'; stateText = 'Bạn chưa trả lời câu này.'; }
  else if (attempt.correct) { kind = 'ok'; stateText = 'Trả lời đúng.'; }
  else { kind = 'bad'; stateText = 'Trả lời chưa đúng.'; }

  let extra = '';
  if (attempt.state === 'blank') {
    extra = '<p class="fb__note">Hãy chọn một phương án hoặc nhập đáp số rồi bấm "Kiểm tra đáp án". Phần lời giải bên dưới vẫn có sẵn nếu bạn muốn đọc trước.</p>';
  } else if (attempt.state === 'wrong' && q.type === 'mcq') {
    const r = ML.grade(q, attempt.answer);
    extra = '<p class="fb__note">Câu này cần chọn <b>đầy đủ</b> các đáp án đúng.' +
      (r.missing && r.missing.length ? ' Bạn còn thiếu: <b>' + r.missing.map(function (i) { return 'ABCD'.charAt(i); }).join(', ') + '</b>.' : '') +
      (r.extra && r.extra.length ? ' Bạn chọn thừa: <b>' + r.extra.map(function (i) { return 'ABCD'.charAt(i); }).join(', ') + '</b>.' : '') + '</p>';
  } else if (attempt.state === 'wrong' && attempt.reason) {
    extra = '<p class="fb__note">' + esc(attempt.reason) + '</p>';
  }

  const badge = attempt.state === 'blank' ? '• Chưa trả lời' : (attempt.correct ? '✓ Đúng' : '✕ Chưa đúng');
  return '<div class="fb fb--' + kind + '">' +
    '<div class="fb__badge">' + badge + '</div>' +
    '<div class="fb__body"><div class="fb__state">' + esc(stateText) + '</div>' + extra +
    '<dl class="fb__answers">' +
    '<div><dt>Bạn đã chọn</dt><dd>' + (attempt.state === 'blank' ? '<i>chưa có</i>' : answerText(q, attempt.answer)) + '</dd></div>' +
    '<div><dt>Đáp án chính xác</dt><dd class="tx-ok"><b>' + answerText(q, q.correct) + '</b></dd></div>' +
    '</dl>' +
    '</div></div>';
}
/* ============ C + D: giải thích cốt lõi, ngắn gọn như giáo viên ============ */
function whyHTML(q, attempt) {
  const e = q.explain || {};
  let h = '';
  if (e.correct) {
    h += '<div class="exp"><div class="exp__h">Vì sao đáp án này đúng</div><p>' + e.correct + '</p></div>';
  }
  if (attempt.state === 'wrong' && e.wrong) {
    h += '<div class="exp exp--warn"><div class="exp__h">Vì sao câu trả lời của bạn chưa đúng</div><p>' + e.wrong + '</p></div>';
  } else if (attempt.correct) {
    h += '<p class="teacher-note">Tốt. Hãy kiểm tra các bước giải để chắc rằng bạn hiểu cách làm, không chỉ nhớ đáp án.</p>';
  }
  return h;
}

function optionAnalysisHTML(q) {
  const e = q.explain || {};
  if (!e.perOption || !e.perOption.length || (q.type !== 'mc1' && q.type !== 'mcq')) return '';
  return '<div class="exp"><div class="exp__h">Phân tích phương án</div><ul class="anlys">' +
    e.perOption.slice(0, q.options ? q.options.length : 0).map(function (t) { return '<li>' + t + '</li>'; }).join('') +
    '</ul></div>';
}

/* ============ F: lời giải từng bước ============ */
function stepsHTML(q) {
  const st = (q.explain && q.explain.steps) || [];
  if (!st.length) return '';
  return '<div class="exp"><div class="exp__h">Lời giải từng bước</div><ol class="steps">' +
    st.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>';
}
/* ============ G: kiến thức cần củng cố ============ */
function reinforceHTML(q) {
  const e = q.explain || {};
  const tp = C.getTopic(q.topicId);
  const les = C.getLesson(q.lessonId);
  return '<div class="reinf">' +
    '<div class="reinf__col"><h4>Kiến thức liên quan</h4><p>' + (e.related || '') +
    (les ? ' <a href="#/theory/lesson?id=' + les.id + '">Mở bài: ' + esc(les.name) + '</a>' +
      (tp ? ' — chủ đề "' + esc(tp.name) + '"' : '') : '') + '</p></div>' +
    '<div class="reinf__col"><h4>Lỗi dễ mắc</h4><p>' + (e.mistake || '') + '</p></div>' +
    '<div class="reinf__col"><h4>Mẹo ghi nhớ</h4><p>' + (e.tip || '') + '</p></div>' +
    '<div class="reinf__col"><h4>Bạn nên làm gì tiếp theo</h4><p>' + (e.next || '') +
    ' <a href="#/theory/lesson?id=' + q.lessonId + '">Xem lại lý thuyết liên quan</a>.</p></div>' +
    '</div>';
}

/* ============ H: hành động sau khi xem lời giải ============ */
function actionsHTML(q) {
  const und = S.understood.get(q.id);
  const similar = ML.Bank.filter({ topicId: q.topicId }).filter(function (x) { return x.id !== q.id; });
  const simId = similar.length ? ML.Bank.sample(similar, 1)[0].id : '';
  let h = '<div class="fb-actions"><span class="fb-actions__label">Bạn đã hiểu cách giải?</span>' +
    '<button class="btn' + (und === true ? ' btn--primary' : '') + '" type="button" data-act="understood" data-id="' + q.id + '" data-v="1">Đã hiểu</button>' +
    '<button class="btn' + (und === false ? ' btn--danger' : '') + '" type="button" data-act="understood" data-id="' + q.id + '" data-v="0">Cần ôn thêm</button>' +
    '<button class="btn btn--ghost" type="button" data-act="flag" data-id="' + q.id + '">' + (S.flagged.get(q.id) ? 'Bỏ đánh dấu' : 'Đánh dấu') + '</button>' +
    '<a class="btn btn--ghost" href="#/theory/lesson?id=' + q.lessonId + '">Lý thuyết</a>';
  if (simId) h += '<a class="btn btn--ghost" href="#/question?id=' + simId + '&mode=similar">Câu tương tự →</a>';
  return h + '</div>';
}

function detailsHTML(q) {
  const hasMore = (q.explain && q.explain.perOption && q.explain.perOption.length) ||
    (q.explain && (q.explain.related || q.explain.mistake || q.explain.tip || q.explain.next));
  if (!hasMore) return '';
  return '<details class="teacher-more"><summary>Xem phân tích thêm và kiến thức cần nhớ</summary>' +
    '<div class="teacher-more__body">' + optionAnalysisHTML(q) + reinforceHTML(q) + '</div></details>';
}

function explanationHTML(q, attempt) {
  return '<div class="exp-wrap">' + resultBanner(q, attempt) + whyHTML(q, attempt) +
    stepsHTML(q) + detailsHTML(q) + actionsHTML(q) + '</div>';
}

function feedbackHTML(q, attempt) {
  return '<div class="exp-wrap">' + resultBanner(q, attempt) + whyHTML(q, attempt) +
    stepsHTML(q) + detailsHTML(q) + actionsHTML(q) + '</div>';
}

G.QUESTION = { feedbackHTML: feedbackHTML, explanationHTML: explanationHTML, resultBanner: resultBanner, find: findQuestion };

G.VIEWS = G.VIEWS || {};
G.VIEWS.question = view;

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="view-history">
/* ===== MODULE: view-history (js/views/history.js) ===== */
/* ============================================================
   VIEW: ÔN TẬP CỦA TÔI · LỊCH SỬ · SỔ TAY · CẦN CỦNG CỐ · CÀI ĐẶT
   ============================================================ */
(function (G) {
'use strict';

const C = G.CURRICULUM, ML = G.MathLib, S = G.Store, U = G.UI, esc = ML.esc;

const FILTERS = {
  wrong: { title: 'Câu trả lời sai', pick: wrongLast },
  correct: { title: 'Câu trả lời đúng', pick: rightLast },
  notunderstood: { title: 'Câu chưa hiểu', pick: notUnderstood },
  flagged: { title: 'Câu đã đánh dấu', pick: flagged },
  all: { title: 'Tất cả câu đã làm', pick: attempted },
  undone: { title: 'Câu chưa từng làm', pick: neverDone }
};

function attempted(all) {
  return all.filter(function (q) { return S.attempts.all(q.id).length > 0; });
}
function wrongLast(all) {
  return all.filter(function (q) { const a = S.attempts.all(q.id); return a.length && !a[a.length - 1].correct; });
}
function rightLast(all) {
  return all.filter(function (q) { const a = S.attempts.all(q.id); return a.length && a[a.length - 1].correct; });
}
function notUnderstood(all) {
  return all.filter(function (q) { return S.data().understood[q.id] === false; });
}
function flagged(all) {
  const set = S.flagged.ids();
  return all.filter(function (q) { return set.indexOf(q.id) >= 0; });
}
function neverDone(all) {
  return all.filter(function (q) { return S.attempts.all(q.id).length === 0; });
}

/* ---------- Bộ lọc dùng chung ---------- */
function filterBar(subject, cog, chapterId) {
  const sub = C.getSubject(subject);
  let chOpts = '<option value="">Tất cả chương</option>';
  sub.semesters.forEach(function (sem) {
    sem.chapters.forEach(function (ch) {
      chOpts += '<option value="' + ch.id + '"' + (chapterId === ch.id ? ' selected' : '') + '>' + esc(ch.name) + '</option>';
    });
  });
  const cogOpts = '<option value="ALL">Tất cả mức độ</option>' +
    ['NB', 'TH', 'VD', 'VDC'].map(function (k) {
      return '<option value="' + k + '"' + (cog === k ? ' selected' : '') + '>' + U.COG_LABEL[k] + '</option>';
    }).join('');
  return '<form class="filters" data-act="filterForm">' +
    '<label>Môn<select name="subject">' +
    ['toan', 'ly'].map(function (s) { return '<option value="' + s + '"' + (s === subject ? ' selected' : '') + '>' + C.getSubject(s).name + '</option>'; }).join('') +
    '</select></label>' +
    '<label>Chương<select name="chapter">' + chOpts + '</select></label>' +
    '<label>Mức độ nhận thức<select name="cog">' + cogOpts + '</select></label>' +
    '<input type="hidden" name="kind" value="">' +
    '</form>';
}

/* ---------- Danh sách câu hỏi ---------- */
function qRow(q) {
  const les = C.getLesson(q.lessonId);
  const a = S.attempts.all(q.id);
  const last = a.length ? a[a.length - 1] : null;
  const und = S.data().understood[q.id];
  let stateChip;
  if (!a.length) stateChip = U.chip('Chưa làm', 'neutral');
  else if (last.correct) stateChip = U.chip('Đúng lần gần nhất', 'ok');
  else stateChip = U.chip('Chưa đúng lần gần nhất', 'bad');
  return '<a class="qrow" href="#/question?id=' + q.id + '&mode=review">' +
    '<div class="qrow__main"><div class="qrow__q" data-tex="' + esc(q.question.slice(0, 160)) + '"></div>' +
    '<div class="qrow__meta">' + esc(les ? les.name : q.lessonId) + ' · ' + esc(C.getTopic(q.topicId) ? C.getTopic(q.topicId).name : '') +
    ' · ' + U.COG_LABEL[q.cognitive] + (a.length ? ' · ' + a.length + ' lần làm' : '') + '</div></div>' +
    '<div class="qrow__tags">' + stateChip +
    (und === true ? U.chip('Đã hiểu', 'ok') : '') +
    (und === false ? U.chip('Chưa hiểu', 'warn') : '') +
    (S.flagged.get(q.id) ? U.chip('Đã đánh dấu', 'warn') : '') +
    '</div></a>';
}

/* ---------- Ôn tập của tôi ---------- */
function myView(params) {
  const subject = params.subject === 'ly' ? 'ly' : 'toan';
  const cog = params.cog === 'ALL' ? null : params.cog;
  const chapterId = params.chapter || null;
  const pool = ML.Bank.filter({ subject: subject, chapterId: chapterId, cognitive: cog });

  let h = '';
  h += '<div class="page-head"><h1>Ôn tập của tôi</h1>' +
    '<p class="muted">Toàn bộ câu hỏi bạn đã làm, kèm lựa chọn của lần trước, đáp án đúng và trạng thái ôn tập. Bạn có thể làm lại mà không mất lịch sử cũ.</p></div>';
  h += filterBar(subject, cog || 'ALL', chapterId);
  h += '<div class="segment" style="margin-bottom:14px">' +
    Object.keys(FILTERS).map(function (k) {
      return '<button class="segment__btn' + ((params.kind || 'all') === k ? ' is-active' : '') +
        '" data-act="setKind" data-kind="' + k + '">' + FILTERS[k].title + ' (' + FILTERS[k].pick(pool).length + ')</button>';
    }).join('') + '</div>';

  const kind = params.kind || 'all';
  const list = FILTERS[kind] ? FILTERS[kind].pick(pool) : attempted(pool);
  h += '<div class="btn-row"><a class="btn btn--primary" href="#/review?kind=wrong&subject=' + subject + '">Luyện riêng: chỉ câu sai</a>' +
    '<a class="btn" href="#/review?kind=notunderstood&subject=' + subject + '">Câu chưa hiểu</a>' +
    '<a class="btn" href="#/review?kind=flagged&subject=' + subject + '">Câu đã đánh dấu</a></div>';

  if (!list.length) {
    h += U.empty('Chưa có câu nào trong nhóm này',
      'Nhóm "' + (FILTERS[kind] ? FILTERS[kind].title : '') + '" hiện chưa có câu phù hợp với bộ lọc của bạn.',
      '<a class="btn btn--primary" href="#/practice?subject=' + subject + '">Đi luyện tập</a>');
  } else {
    h += U.card(FILTERS[kind] ? FILTERS[kind].title : 'Danh sách câu hỏi',
      '<div class="list">' + list.slice(0, 60).map(qRow).join('') + '</div>' +
      (list.length > 60 ? '<p class="muted small">Hiển thị 60/' + list.length + ' câu. Hãy thu hẹp bộ lọc để xem đầy đủ hơn.</p>' : ''),
      { flush: true, bodyClass: 'card__body card__body--list' });
  }
  return h;
}
/* ---------- Lịch sử luyện tập: mọi lần làm đều được giữ riêng ---------- */
function historyView(params) {
  const subject = params.subject;
  let attempts = ML.Bank.all().filter(function (q) { return S.attempts.all(q.id).length > 0; });
  if (subject) attempts = attempts.filter(function (q) { return q.subject === subject; });
  attempts.sort(function (a, b) {
    const ta = S.attempts.all(a.id).slice(-1)[0].at;
    const tb = S.attempts.all(b.id).slice(-1)[0].at;
    return tb - ta;
  });

  let h = '';
  h += '<div class="page-head"><h1>Lịch sử luyện tập</h1>' +
    '<p class="muted">Mỗi lần làm bài được lưu riêng, không bị gộp thành một kết quả duy nhất — nên bạn phân biệt được lần trả lời trước với lần sau.</p></div>';
  h += '<div class="segment" style="margin-bottom:14px">' +
    ['', 'toan', 'ly'].map(function (s) {
      return '<button class="segment__btn' + ((params.subject || '') === s ? ' is-active' : '') +
        '" data-route="#/history' + (s ? '?subject=' + s : '') + '">' + (s ? C.getSubject(s).name : 'Cả hai môn') + '</button>';
    }).join('') + '</div>';

  const sessions = S.sessions.all();
  if (sessions.length) {
    h += U.card('Các phiên luyện tập gần đây',
      '<div class="list">' + sessions.slice(0, 10).map(function (ss) {
        return '<div class="sess"><div><b>' + esc(C.getSubject(ss.subject) ? C.getSubject(ss.subject).name : ss.subject) + '</b>' +
          ' — ' + ss.ids.length + ' câu<div class="muted small">' + esc(ss.label || '') + ' · ' + U.fmtDate(ss.at) + '</div></div></div>';
      }).join('') + '</div>');
  }

  if (!attempts.length) {
    h += U.empty('Chưa có lịch sử làm bài', 'Mỗi câu bạn làm đều được ghi lại tại đây kèm đầy đủ giải thích và trạng thái ôn tập.',
      '<a class="btn btn--primary" href="#/practice?subject=toan">Bắt đầu luyện tập</a>');
    return h;
  }

  h += U.card('Câu hỏi đã làm (' + attempts.length + ')',
    '<div class="list">' + attempts.slice(0, 50).map(function (q) {
      const les = C.getLesson(q.lessonId);
      const log = S.attempts.all(q.id);
      const last = log[log.length - 1];
      return '<div class="hist">' +
        '<div class="hist__main"><a href="#/question?id=' + q.id + '&mode=review"><b>' + esc(les ? les.name : q.lessonId) + '</b></a>' +
        '<div class="qrow__q" data-tex="' + esc(q.question.slice(0, 140)) + '"></div></div>' +
        '<div class="hist__log">' +
        (last.correct ? U.chip('Đúng lần gần nhất', 'ok') : U.chip('Chưa đúng lần gần nhất', 'bad')) +
        U.chip(log.length + ' lần làm', 'neutral') +
        '<span class="muted small">Lần gần nhất: ' + U.fmtDate(last.at) + '</span>' +
        '</div>' +
        '<div class="hist__prev"><span class="muted small">Các lần trả lời trước:</span><ol>' +
        log.slice(0, -1).slice(-4).map(function (a) {
          return '<li class="muted small">' + U.fmtDate(a.at) + ' — ' + (a.correct ? 'đúng' : 'chưa đúng') +
            (a.mode === 'review' ? ' (làm lại)' : '') + '</li>';
        }).join('') + '</ol></div>' +
        '<div class="hist__actions"><a class="btn btn--sm" href="#/question?id=' + q.id + '&mode=review">Mở lại &amp; làm lại</a></div>' +
        '</div>';
    }).join('') + '</div>', { flush: true, bodyClass: 'card__body card__body--list' });
  return h;
}
/* ================= SỔ TAY KIẾN THỨC ================= */
function notesView(params) {
  const formulaKeys = S.formulas.all();
  const noteKeys = S.notes.allKeys();
  const wrongMany = ML.Bank.all().filter(function (q) { return S.attempts.wrongCount(q.id) >= 2; });
  const flaggedLessons = S.theory.flaggedIds().map(function (id) { return C.getLesson(id); }).filter(Boolean);
  const qNotUnderstood = ML.Bank.all().filter(function (q) { return S.data().understood[q.id] === false; });

  let h = '';
  h += '<div class="page-head"><h1>Sổ tay kiến thức</h1>' +
    '<p class="muted">Nơi tự động gom lại công thức bạn đã lưu, các khái niệm dễ nhầm, câu làm sai nhiều lần và chủ đề cần ôn. Bạn cũng có thể tự thêm ghi chú.</p></div>';

  /* 1. Công thức đã lưu */
  h += U.card('Công thức đã lưu (' + formulaKeys.length + ')',
    formulaKeys.length
      ? '<div class="list">' + formulaKeys.map(function (f) {
          const les = C.getLesson(f.key.split('::')[0]);
          return '<div class="notecard"><div class="notecard__head"><b>' + esc(f.title) + '</b>' +
            (les ? '<a class="btn btn--sm btn--ghost" href="#/theory/lesson?id=' + les.id + '">Mở bài: ' + esc(les.name) + '</a>' : '') +
            '<button class="btn btn--sm btn--danger" data-act="formulaDel" data-key="' + esc(f.key) + '">Xóa</button></div>' +
            '<div class="notecard__tex" data-tex="' + esc(f.tex) + '" data-display="1"></div></div>';
        }).join('') + '</div>'
      : '<p class="muted">Chưa có công thức nào. Khi đọc bài lý thuyết, bấm <b>“Lưu vào sổ tay”</b> ở công thức quan trọng.</p>');

  /* 2. Bài đã đánh dấu cần ôn lại */
  h += U.card('Bài lý thuyết được đánh dấu (' + flaggedLessons.length + ')',
    flaggedLessons.length
      ? '<div class="list">' + flaggedLessons.map(function (l) {
          return '<a class="list__item" href="#/theory/lesson?id=' + l.id + '">' +
            '<div class="list__main"><div class="list__title">' + esc(l.name) + '</div>' +
            '<div class="list__sub">' + esc(l.chapterName) + '</div></div>' +
            '<div class="list__meta">' + U.chip('Cần ôn lại', 'warn') + '</div></a>';
        }).join('') + '</div>'
      : '<p class="muted">Chưa có bài nào được đánh dấu. Trong trang bài học, nút <b>“Cần ôn lại”</b> sẽ lưu bài vào đây.</p>');

  /* 3. Câu làm sai nhiều lần */
  h += U.card('Câu làm sai nhiều lần (' + wrongMany.length + ')',
    wrongMany.length
      ? '<div class="list">' + wrongMany.slice(0, 40).map(function (q) {
          return '<a class="list__item" href="#/question?id=' + q.id + '&mode=review">' +
            '<div class="list__main"><div class="list__title" data-tex="' + esc(q.question.slice(0, 120)) + '"></div>' +
            '<div class="list__sub">' + esc(C.getTopic(q.topicId) ? C.getTopic(q.topicId).name : '') + ' · sai ' + S.attempts.wrongCount(q.id) + ' lần</div></div>' +
            '<div class="list__meta">' + U.chip('Làm lại', 'bad') + '</div></a>';
        }).join('') + '</div>'
      : '<p class="muted">Chưa có câu nào bị sai từ hai lần trở lên. Hãy tiếp tục luyện các bài mới.</p>');

  /* 4. Câu chưa hiểu sau lời giải */
  h += U.card('Câu đã xem lời giải nhưng vẫn chưa hiểu (' + qNotUnderstood.length + ')',
    qNotUnderstood.length
      ? '<div class="list">' + qNotUnderstood.slice(0, 40).map(function (q) {
          const les = C.getLesson(q.lessonId);
          return '<a class="list__item" href="#/question?id=' + q.id + '&mode=review">' +
            '<div class="list__main"><div class="list__title">' + esc(les ? les.name : q.lessonId) + '</div>' +
            '<div class="list__sub">' + esc(C.getTopic(q.topicId) ? C.getTopic(q.topicId).name : '') + '</div></div>' +
            '<div class="list__meta"><a class="btn btn--sm" href="#/theory/lesson?id=' + q.lessonId + '">Xem lý thuyết</a></div></a>';
        }).join('') + '</div>'
      : '<p class="muted">Chưa có câu nào được đánh dấu “tôi vẫn chưa hiểu”.</p>');

  /* 5. Ghi chú cá nhân */
  let notesHtml = '<p class="muted">Chưa có ghi chú. Trong mỗi bài lý thuyết có mục “Ghi chú của bạn cho bài này”.</p>';
  if (noteKeys.length) {
    notesHtml = '<div class="list">' + noteKeys.map(function (key) {
      const les = C.getLesson(key);
      return '<div class="notecard"><div class="notecard__head"><b>' + esc(les ? les.name : key) + '</b>' +
        (les ? '<a class="btn btn--sm btn--ghost" href="#/theory/lesson?id=' + key + '">Mở nội dung gốc</a>' : '') + '</div>' +
        '<ul class="notes">' + S.notes.list(key).map(function (n, i) {
          return '<li><div class="notes__text">' + esc(n.text) + '</div>' +
            '<div class="notes__meta"><span class="muted small">' + U.fmtDate(n.at) + '</span>' +
            '<button class="btn btn--sm btn--ghost" data-act="noteEdit" data-key="' + esc(key) + '" data-i="' + i + '">Sửa</button>' +
            '<button class="btn btn--sm btn--ghost" data-act="noteDel" data-key="' + esc(key) + '" data-i="' + i + '">Xóa</button></div></li>';
        }).join('') + '</ul></div>';
    }).join('') + '</div>';
  }
  h += U.card('Ghi chú do bạn tự nhập (' + noteKeys.length + ' bài)', notesHtml);
  return h;
}
/*__MISC2__*/


G.VIEWS = G.VIEWS || {};
G.VIEWS.history = historyView;
G.VIEWS.my = myView;

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="view-misc">

   ============================================================ */
(function (G) {

/* ---------- CHỦ ĐỀ CẦN CỦNG CỐ ---------- */
function qLine(q, metaExtra) {

  return '<a class="list__item" href="#/question?id=' + q.id + '&mode=review">' +

    '<div class="list__sub">' + esc(les ? les.name : q.lessonId) + ' · ' + esc(tp ? tp.name : '') +
    ' · ' + U.COG_LABEL[q.cognitive] + (metaExtra ? ' · ' + metaExtra(q) : '') + '</div></div>' +
    '<div class="list__meta">' + U.chip('Làm lại', 'bad') + '</div></a>';
}

function reinforceView(params) {
  const all = ML.Bank.all();
  const notU = all.filter(function (q) { return S.data().understood[q.id] === false; });
  const wrongMany = all.filter(function (q) { return S.attempts.wrongCount(q.id) >= 2; });
  const flaggedQ = S.flagged.ids().map(function (id) { return all.find(function (q) { return q.id === id; }); }).filter(Boolean);
  const flaggedL = S.theory.flaggedIds().map(function (id) { return C.getLesson(id); }).filter(Boolean);

  const topicStats = {};
  all.forEach(function (q) {
    const a = S.attempts.all(q.id);
    if (!a.length) return;
    const t = topicStats[q.topicId] || (topicStats[q.topicId] = { lessonId: q.lessonId, done: 0, wrong: 0 });
    t.done++;
    if (!a[a.length - 1].correct) t.wrong++;

    '<p class="muted">Danh sách tự động tổng hợp từ lịch sử học tập: câu đánh dấu “tôi vẫn chưa hiểu”, câu làm sai nhiều lần và chủ đề còn trả lời sai ở lần gần nhất. Đây không phải phán xét năng lực — chỉ giúp bạn biết nên quay lại phần nào.</p></div>';

        '<div class="btn-row" style="margin-top:10px">' + groupBtn(notU.map(function (q) { return q.id; }), 'Luyện tập nhóm câu này →') + '</div>'
      : '<p>Chưa có câu nào được đánh dấu “tôi vẫn chưa hiểu”. Sau khi đọc lời giải, nếu cảm thấy chưa đủ sáng tỏ, hãy bấm nút tương ứng trong trang câu hỏi — câu đó sẽ xuất hiện tại đây.</p>');

  h += U.card('Câu làm sai từ hai lần trở lên (' + wrongMany.length + ')',

      ? '<div class="list">' + wrongMany.slice(0, 30).map(function (q) {

        '<div class="btn-row" style="margin-top:10px">' + groupBtn(wrongMany.map(function (q) { return q.id; }), 'Ôn lại nhóm câu này →') + '</div>'
      : '<p>Chưa có câu nào bị sai từ hai lần trở lên. Hãy tiếp tục luyện tập — nếu có, chúng sẽ tự động hiện ở đây.</p>');

  h += U.card('Câu đã đánh dấu cần ôn lại (' + flaggedQ.length + ')',
    flaggedQ.length
      ? '<div class="list">' + flaggedQ.slice(0, 30).map(function (q) { return qLine(q); }).join('') + '</div>' +
        '<div class="btn-row" style="margin-top:10px">' + groupBtn(flaggedQ.map(function (q) { return q.id; }), 'Ôn các câu đã đánh dấu →') + '</div>'
      : '<p>Chưa có câu nào được đánh dấu. Nút <b>“Đánh dấu để ôn lại”</b> trong trang câu hỏi sẽ lưu câu vào đây.</p>');

  h += U.card('Bài lý thuyết được đánh dấu “cần ôn lại” (' + flaggedL.length + ')',
    flaggedL.length
      ? '<div class="list">' + flaggedL.map(function (l) {
          return '<a class="list__item" href="#/theory/lesson?id=' + l.id + '">' +
            '<div class="list__main"><div class="list__title">' + esc(l.name) + '</div>' +
            '<div class="list__sub">' + esc(l.chapterName) + '</div></div>' +
            '<div class="list__meta">' + U.chip('Cần ôn lại', 'warn') + '</div></a>';
        }).join('') + '</div>'
      : '<p>Chưa có bài nào được đánh dấu. Trang bài lý thuyết có nút <b>“Cần ôn lại”</b> ở thanh hành động.</p>');

  h += U.card('Chủ đề còn trả lời sai ở lần gần nhất (' + weakTopics.length + ' chủ đề)',
    weakTopics.length
      ? '<div class="list">' + weakTopics.map(function (t) {
          const les = C.getLesson(t.lessonId);
          const tp = C.getTopic(t.topicId);
          const nQ = ML.Bank.filter({ topicId: t.topicId }).length;
          return '<a class="list__item" href="#/practice?lesson=' + t.lessonId + '">' +
            '<div class="list__main"><div class="list__title">' + esc(tp ? tp.name : t.topicId) + '</div>' +
            '<div class="list__sub">' + esc(les ? les.name : t.lessonId) + ' · đã làm ' + t.done + '/' + nQ + ' câu · lần gần nhất sai ' + t.wrong + '</div></div>' +
            '<div class="list__meta">' + U.chip('Luyện chủ đề này', 'warn') + '</div></a>';
        }).join('') + '</div>'
      : '<p>Chưa có chủ đề nào cần củng cố — hoặc bạn chưa làm bài nào. Trang <a href="#/practice?subject=toan">Luyện tập ứng dụng</a> giúp bạn bắt đầu.</p>');

  return h;
}

/* ---------- LUYỆN RIÊNG (nhóm câu đặc biệt) ---------- */
function reviewView(params) {
  const kind = params.kind || 'wrong';
  const subject = params.subject || null;
  const LABEL = { wrong: 'chỉ câu sai', notunderstood: 'câu chưa hiểu', flagged: 'câu đã đánh dấu', all: 'tất cả câu đã làm' };
  const pool = ML.Bank.filter({ subject: subject });
  let pick;
  if (kind === 'wrong') {
    pick = pool.filter(function (q) { const a = S.attempts.all(q.id); return a.length && !a[a.length - 1].correct; });
  } else if (kind === 'notunderstood') {
    pick = pool.filter(function (q) { return S.data().understood[q.id] === false; });
  } else if (kind === 'flagged') {
    const set = S.flagged.ids();
    pick = pool.filter(function (q) { return set.indexOf(q.id) >= 0; });
  } else {
    pick = pool.filter(function (q) { return S.attempts.all(q.id).length > 0; });
  }
  if (!pick.length) {
    return U.empty('Không có câu nào để luyện trong nhóm này',
      'Hiện chưa có câu phù hợp với yêu cầu “' + (LABEL[kind] || kind) + '”. Hãy làm thêm bài tập — kết quả sẽ tự động cập nhật.',
      '<a class="btn btn--primary" href="#/my?subject=' + (subject || 'toan') + '">Về Ôn tập của tôi</a>');
  }
  const ids = ML.Bank.shuffle(pick).map(function (q) { return q.id; });
  const subj = subject || (pick[0] ? pick[0].subject : 'toan');
  G.Session.set({ ids: ids, index: 0, subject: subj, label: 'Ôn lại: ' + (LABEL[kind] || kind) });
  S.sessions.add({ id: 's' + Date.now(), subject: subj, ids: ids, at: Date.now(), label: 'Ôn lại: ' + (LABEL[kind] || kind) });
  return G.VIEWS.run(params);
}

/* ---------- CÀI ĐẶT & DỮ LIỆU CÁ NHÂN ---------- */
function settingsView() {
  const d = S.data();

    '<p class="muted small">Giao diện tối hiển thị đồng bộ công thức toán — nếu công thức khó đọc, hãy quay lại giao diện sáng.</p>');

  h += U.card('Dữ liệu cá nhân trên máy này',
    '<div class="grid grid--4">' +
    '<div class="stat"><div class="stat__value">' + attempted + '</div><div class="stat__label">câu đã làm</div></div>' +
    '<div class="stat"><div class="stat__value">' + totalAttempts + '</div><div class="stat__label">lần trả lời</div></div>' +
    '<div class="stat"><div class="stat__value">' + notesCount + '</div><div class="stat__label">bài có ghi chú</div></div>' +
    '<div class="stat"><div class="stat__value">' + formulaCount + '</div><div class="stat__label">công thức đã lưu</div></div>' +

    '<div class="btn-row" style="margin-top:14px">' +

  const formatList = [

  const formatTable = '<div class="tbl--wrap"><table class="table"><thead><tr><th>Hình thức câu hỏi</th><th class="num">Toán 12</th><th class="num">Vật lí 12</th></tr></thead><tbody>' +

    '<div class="stat"><div class="stat__value">' + lyQ.toLocaleString('vi-VN') + '</div><div class="stat__label">Vật lí 12</div></div>' +

    '</ul>');

  h += U.card('Hướng dẫn chạy dự án',

    '<li><b>Cách khuyến nghị:</b> chạy máy chủ tĩnh trong thư mục dự án, ví dụ <code>python -m http.server 8000</code> rồi truy cập <code>http://localhost:8000</code>.</li>' +
    '<li>Cần có kết nối internet để tải KaTeX và font chữ từ CDN; khi mất mạng, phần chữ vẫn đọc được nhưng công thức hiển thị dạng văn bản thô.</li>' +

G.VIEWS = G.VIEWS || {};
