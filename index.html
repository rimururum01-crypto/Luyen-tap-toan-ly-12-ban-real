<script data-module="view-search">
/* ===== MODULE: view-search (js/views/search.js) ===== */
/* ============================================================
   TÌM KIẾM TOÀN WEBSITE — chương, bài học, chủ đề, câu hỏi, công thức
   ============================================================ */
(function (G) {
'use strict';

const C = G.CURRICULUM, ML = G.MathLib, U = G.UI, esc = ML.esc;

function norm(value) {
  return String(value == null ? '' : value).normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
}
function includes(hay, needle) { return norm(hay).includes(norm(needle)); }
function link(route, title, meta, type) {
  return '<a class="search-result" href="' + esc(route) + '">' +
    '<span class="search-result__icon" aria-hidden="true">' + esc(type) + '</span>' +
    '<span class="search-result__main"><b>' + esc(title) + '</b><small>' + esc(meta) + '</small></span>' +
    '<span class="search-result__arrow" aria-hidden="true">↗</span></a>';
}

function searchView(params) {
  const query = String(params.q || '').trim();
  if (!query) {
    return '<div class="page-head search-hero"><div class="eyebrow">THƯ VIỆN HỌC TẬP</div><h1>Tìm nhanh kiến thức bạn cần</h1>' +
      '<p class="muted">Tìm trong bài học, chủ đề, công thức và ngân hàng câu hỏi Toán 12 – Vật lí 12.</p>' +
      '<form class="search-inline" id="searchPageForm"><input name="q" type="search" placeholder="Ví dụ: đạo hàm, xác suất, dao động điều hòa…" aria-label="Từ khóa tìm kiếm" required><button class="btn btn--primary" type="submit">Tìm kiếm</button></form>' +
      '<div class="search-suggestions"><span>Gợi ý:</span> <a href="#/search?q=đạo hàm">Đạo hàm</a><a href="#/search?q=xác suất">Xác suất</a><a href="#/search?q=dao động điều hòa">Dao động điều hòa</a><a href="#/search?q=điện từ trường">Điện từ trường</a></div></div>' +
      U.card('Bắt đầu từ đâu?', '<div class="grid grid--2"><a class="search-shortcut" href="#/theory?subject=toan"><b>Ôn lý thuyết Toán 12</b><span>Xem theo chương và bài học →</span></a><a class="search-shortcut" href="#/theory?subject=ly"><b>Ôn lý thuyết Vật lí 12</b><span>Khái niệm, công thức và ví dụ →</span></a><a class="search-shortcut" href="#/practice?subject=toan"><b>Luyện tập Toán</b><span>Chọn dạng bài, mức độ và số câu →</span></a><a class="search-shortcut" href="#/practice?subject=ly"><b>Luyện tập Vật lí</b><span>Làm bài và xem lời giải từng bước →</span></a></div>');
  }

  const qn = norm(query);
  const chapters = [];
  C.SUBJECTS.forEach(function (s) { s.semesters.forEach(function (sem) { sem.chapters.forEach(function (ch) {
    if (includes(ch.name, query) || includes(s.name, query)) chapters.push({ id: ch.id, name: ch.name, subject: s.name, semester: sem.name });
  }); }); });
  const lessons = C.allLessons().filter(function (l) {
    return includes(l.name, query) || includes(l.chapterName, query) || includes(C.getSubject(l.subjectId).name, query);
  });
  const topics = C.allTopics().filter(function (t) {
    return includes(t.name, query) || includes(t.lessonName, query) || includes(t.chapterName, query);
  });
  const questionHits = ML.Bank.all().map(function (q) {
    const topic = C.getTopic(q.topicId), lesson = C.getLesson(q.lessonId), chapter = C.getChapter(q.chapterId);
    const corpus = [q.question, q.explain && q.explain.correct, q.explain && q.explain.related,
      q.explain && q.explain.mistake, q.explain && q.explain.next,
      topic && topic.name, lesson && lesson.name, chapter && chapter.name,
      q.options && q.options.join(' ')].join(' ');
    if (!includes(corpus, query)) return null;
    let score = 0;
    if (includes(q.question, query)) score += 5;
    if (topic && includes(topic.name, query)) score += 3;
    if (lesson && includes(lesson.name, query)) score += 2;
    return { q: q, topic: topic, lesson: lesson, chapter: chapter, score: score };
  }).filter(Boolean).sort(function (a, b) { return b.score - a.score || a.q.id.localeCompare(b.q.id); });

  const total = chapters.length + lessons.length + topics.length + questionHits.length;
  let h = '<div class="page-head search-head"><div class="eyebrow">KẾT QUẢ TÌM KIẾM</div><h1>“' + esc(query) + '”</h1>' +
    '<p class="muted">Tìm thấy ' + total + ' kết quả trong chương trình và ngân hàng câu hỏi. Tìm kiếm không phân biệt chữ hoa, chữ thường hoặc dấu tiếng Việt.</p></div>';
  h += '<form class="search-inline search-inline--compact" id="searchPageForm"><input name="q" type="search" value="' + esc(query) + '" aria-label="Từ khóa tìm kiếm" required><button class="btn btn--primary" type="submit">Tìm lại</button><a class="btn btn--ghost" href="#/search">Xóa</a></form>';

  if (!total) return h + U.empty('Chưa tìm thấy nội dung phù hợp', 'Thử một từ khóa ngắn hơn hoặc tìm theo tên chương, tên bài, công thức hay khái niệm.', '<a class="btn btn--primary" href="#/theory">Duyệt danh sách bài học</a>');

  function section(title, count, body, more) {
    return '<section class="card search-section"><div class="card__head"><h2 class="card__title">' + title + '</h2><span class="search-count">' + count + '</span></div><div class="card__body card__body--search">' + body + (more || '') + '</div></section>';
  }
  if (chapters.length) h += section('Chương', chapters.length, chapters.slice(0, 8).map(function (x) {
    return link('#/theory?subject=' + (x.id.indexOf('ly-') === 0 ? 'ly' : 'toan') + '&chapter=' + x.id, x.name, x.subject + ' · ' + x.semester, 'CH');
  }).join(''));
  if (lessons.length) h += section('Bài học', lessons.length, lessons.slice(0, 12).map(function (x) {
    return link('#/lesson/' + x.lessonId, x.name, x.chapterName + ' · ' + C.getSubject(x.subjectId).name, 'BÀI');
  }).join(''));
  if (topics.length) h += section('Chủ đề', topics.length, topics.slice(0, 12).map(function (x) {
    return link('#/practice?subject=' + x.subjectId + '&chapter=' + x.chapterId + '&lesson=' + x.lessonId + '&topic=' + x.topicId, x.name, x.lessonName + ' · ' + x.chapterName, 'CHỦ');
  }).join(''));
  if (questionHits.length) h += section('Câu hỏi luyện tập', questionHits.length, questionHits.slice(0, 30).map(function (x) {
    const q = x.q;
    const typeLabel = (U.TYPE_LABEL && U.TYPE_LABEL[q.type]) || q.type;
    return '<a class="search-result search-result--question" href="#/question?id=' + encodeURIComponent(q.id) + '&mode=review"><span class="search-result__icon">' + (q.subject === 'toan' ? '∑' : 'Φ') + '</span>' +
      '<span class="search-result__main"><b data-tex="' + esc(q.question) + '"></b><small>' + esc((x.lesson ? x.lesson.name : q.lessonId) + ' · ' + (x.topic ? x.topic.name : '') + ' · ' + typeLabel + ' · ' + (U.COG_LABEL[q.cognitive] || q.cognitive)) + '</small></span><span class="search-result__arrow">↗</span></a>';
  }).join(''), questionHits.length > 30 ? '<p class="muted small search-limit">Đang hiển thị 30 trong ' + questionHits.length + ' câu phù hợp. Hãy thêm từ khóa cụ thể hơn để thu hẹp kết quả.</p>' : '');

  return h;
}

G.VIEWS = G.VIEWS || {};
G.VIEWS.search = searchView;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script data-module="event-bindings">
/* ===== MODULE: event-bindings (js/views/bind.js) ===== */
/* ============================================================
   BIND — gắn sự kiện cho các phần tương tác sau khi render view.
   Xử lý tập trung mọi data-act: answerForm, hint, flag, understood,
   bookmark, needReview, ghi chú, công thức, flashcard, tự kiểm tra,
   setupForm, bộ lọc, startGroup, toggleDark, export/reset/import.
   ============================================================ */
(function (G) {
'use strict';

const ML = G.MathLib, S = G.Store, U = G.UI, C = G.CURRICULUM;

/* ---------- Thu thập đáp án theo loại câu ---------- */
function collectAnswer(form, q) {
  if (q.type === 'mc1' || q.type === 'tf') {
    const el = form.querySelector('input[name="ans"]:checked');
    if (!el) return null;
    if (q.type === 'tf') return el.value === 'T';
    return Number(el.value);
  }
  if (q.type === 'mcq') {
    const els = form.querySelectorAll('input[name="ans"]:checked');
    return Array.prototype.map.call(els, function (el) { return Number(el.value); });
  }
  const el = form.querySelector('input[name="ans"]');
  return el ? el.value.trim() : '';
}

function form_lock(root, q, attempt) {
  const form = root.querySelector('#answerForm');
  if (!form) return;
  Array.prototype.forEach.call(form.querySelectorAll('input'), function (el) { el.disabled = true; });
  const btn = form.querySelector('[data-act="check"]');
  if (btn) btn.remove();
  const again = document.createElement('a');
  again.className = 'btn';
  again.href = '#/question?id=' + q.id + '&mode=' + (attempt.mode || 'practice');
  again.textContent = '↻ Làm lại câu này';
  const actions = form.querySelector('.qcard__actions');
  if (actions) actions.appendChild(again);
}

/* ---------- Hiển thị phản hồi sau khi chấm ---------- */
function showFeedback(root, q, attempt) {
  const fb = root.querySelector('#feedback');
  if (!fb) return;
  fb.innerHTML = G.QUESTION.feedbackHTML(q, attempt);
  ML.renderInto(fb);
  ML.renderMath(fb);
  form_lock(root, q, attempt);
  if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------- Trả lời & chấm điểm ---------- */
function onAnswer(root, form) {
  const qid = form.getAttribute('data-id');
  const mode = form.getAttribute('data-mode') || 'practice';
  const q = ML.Bank.byId(qid);
  if (!q) { U.toast('Không tìm thấy câu hỏi.', 'bad'); return; }
  const answer = collectAnswer(form, q);
  const res = ML.grade(q, answer);
  if (res.state === 'blank' || res.kind === 'empty') { U.toast(res.note || 'Bạn chưa trả lời câu này.', 'warn'); return; }
  const attempt = S.attempts.record(qid, answer, res.correct, mode, { state: res.state, reason: res.reason });
  attempt.state = res.state;
  attempt.reason = res.reason;
  showFeedback(root, q, attempt);
  U.toast(res.correct
    ? 'Đã lưu kết quả: đúng. Đọc phần giải thích để củng cố nhé.'
    : 'Đã lưu kết quả. Hãy đọc kỹ phần giải thích — mỗi câu sai là một cơ hội học.',
    res.correct ? 'ok' : 'warn');
}

/* ---------- Gợi ý ---------- */
function onHint(root, qid) {
  const box = root.querySelector('#hintBox');
  if (!box) return;
  const q = ML.Bank.byId(qid);
  if (q && q.hint && !box.dataset.done) { ML.renderInto(box); box.dataset.done = '1'; }
  box.hidden = !box.hidden;
}

/* ---------- Đánh dấu / đã hiểu (câu hỏi) ---------- */
function onFlag(btn, qid) {
  const on = S.flagged.toggle(qid);
  btn.textContent = on ? 'Bỏ đánh dấu' : 'Đánh dấu';
  U.toast(on ? 'Đã lưu vào danh sách cần ôn lại.' : 'Đã bỏ đánh dấu.', 'ok');
}

function onUnderstood(btn, qid, v) {
  S.understood.mark(qid, v);
  const group = btn.parentElement;
  if (group) {
    Array.prototype.forEach.call(group.querySelectorAll('[data-act="understood"]'), function (b) {
      b.classList.remove('btn--primary', 'btn--danger');
    });
    btn.classList.add(v ? 'btn--primary' : 'btn--danger');
  }
  if (v) U.toast('Đã ghi nhận: bạn đã hiểu câu này.', 'ok');
  else U.toast('Đã thêm vào danh sách cần ôn lại.', 'warn');
}
/* ---------- Bài lý thuyết: đánh dấu trang / cần ôn lại / đã hiểu ---------- */
function onBookmark(btn, id) {
  const on = S.theory.bookmark(id);
  btn.textContent = on ? 'Bỏ đánh dấu trang' : 'Đánh dấu trang';
  U.toast(on ? 'Đã đánh dấu bài để tìm nhanh trong Sổ tay.' : 'Đã bỏ đánh dấu trang.', 'ok');
}
function onNeedReview(btn, id) {
  const cur = S.theory.flaggedIds().indexOf(id) >= 0;
  S.theory.flag(id, !cur);
  btn.textContent = !cur ? 'Bỏ "cần ôn lại"' : 'Cần ôn lại';
  U.toast(!cur ? 'Bài được thêm vào danh sách cần ôn lại.' : 'Đã bỏ khỏi danh sách cần ôn lại.', 'ok');
}
function onTheoryUnderstood(btn, id) {
  S.theory.mark(id, 'mastered');
  U.toast('Đã lưu trạng thái: bạn đã hiểu bài này.', 'ok');
  const bar = btn.closest('.toolbar__state');
  if (bar) bar.innerHTML = U.chip('Trạng thái: Đã hiểu', 'ok');
}

/* ---------- Ghi chú ---------- */
function onNoteSubmit(form) {
  const key = form.getAttribute('data-key');
  const ta = form.querySelector('textarea[name="text"]');
  const text = ta ? ta.value.trim() : '';
  if (!text) { U.toast('Ghi chú rỗng — hãy nhập nội dung trước.', 'warn'); return; }
  S.notes.add(key, text);
  ta.value = '';
  U.toast('Đã lưu ghi chú vào Sổ tay kiến thức.', 'ok');
  const host = form.parentElement;
  if (host && G.VIEWS.renderNotes) {
    const old = host.querySelector('ul.notes, p.muted.small');
    const tmp = document.createElement('div');
    tmp.innerHTML = G.VIEWS.renderNotes(key);
    if (old && tmp.firstElementChild) old.replaceWith(tmp.firstElementChild);
  }
}
function onNoteEdit(btn) {
  const key = btn.getAttribute('data-key');
  const i = Number(btn.getAttribute('data-i'));
  const cur = S.notes.list(key)[i];
  if (!cur) return;
  const text = prompt('Sửa ghi chú:', cur.text);
  if (text === null) return;
  if (!text.trim()) { U.toast('Không lưu ghi chú rỗng.', 'warn'); return; }
  S.notes.edit(key, i, text.trim());
  G.App.render();
  U.toast('Đã cập nhật ghi chú.', 'ok');
}
function onNoteDel(btn) {
  const key = btn.getAttribute('data-key');
  const i = Number(btn.getAttribute('data-i'));
  if (!confirm('Xóa ghi chú này?')) return;
  S.notes.remove(key, i);
  G.App.render();
  U.toast('Đã xóa ghi chú.', 'ok');
}

/* ---------- Lưu công thức vào sổ tay ---------- */
function onSaveFormula(btn) {
  const key = btn.getAttribute('data-key');
  const title = btn.getAttribute('data-title') || 'Công thức';
  const texStr = btn.getAttribute('data-tex') || '';
  S.formulas.save(key, title, texStr);
  btn.textContent = '✓ Đã lưu';
  U.toast('Đã lưu công thức vào Sổ tay kiến thức.', 'ok');
}
function onFormulaDel(btn) {
  S.formulas.remove(btn.getAttribute('data-key'));
  G.App.render();
  U.toast('Đã bỏ lưu công thức.', 'ok');
}

/* ---------- Flashcard lật thẻ ---------- */
function onFlip(el) {
  const on = el.classList.toggle('is-flipped');
  el.setAttribute('aria-expanded', on ? 'true' : 'false');
}

/* ---------- Phiên luyện tập ---------- */
function startSession(params, ids, label, go) {
  if (!ids.length) {
    U.toast('Không có câu hỏi nào phù hợp với lựa chọn. Hãy thử phạm vi khác.', 'warn');
    return false;
  }
  const first = ML.Bank.byId(ids[0]);
  const sess = { ids: ids, index: 0, subject: params.subject || (first ? first.subject : 'toan'), label: label || '', at: Date.now() };
  G.Session.set(sess);
  S.sessions.add({ id: 's' + Date.now(), subject: sess.subject, ids: ids, at: sess.at, label: label || 'Luyện tập', filters: params });
  go('#/practice/run');
  return true;
}

function onSetupSubmit(form, go) {
  const f = {
    subject: form.subject.value,
    chapterId: form.chapter.value || null,
    lessonId: form.lesson.value || null,
    topicId: form.topic ? (form.topic.value || null) : null,
    cognitive: form.cog.value === 'ALL' ? null : form.cog.value
  };
  const count = Number(form.count.value) || 0;
  const mode = form.mode.value;
  let list = ML.Bank.filter(f);
  if (!list.length) { U.toast('Phạm vi này chưa có câu hỏi. Hãy chọn phạm vi khác.', 'warn'); return; }
  list = mode === 'level' ? ML.Bank.byLevel(list) : ML.Bank.shuffle(list);
  const ids = (count > 0 ? list.slice(0, count) : list).map(function (q) { return q.id; });
  const labelParts = [C.getSubject(f.subject).name];
  if (f.lessonId) labelParts.push(C.getLesson(f.lessonId).name);
  else if (f.chapterId) labelParts.push(C.getChapter(f.chapterId).name);
  if (f.topicId) labelParts.push(C.getTopic(f.topicId).name);
  startSession({ subject: f.subject }, ids, labelParts.join(' — '), go);
}

function onStartGroup(btn, go) {
  const ids = (btn.getAttribute('data-ids') || '').split(',').filter(Boolean);
  const list = ML.Bank.shuffle(ids);
  const first = ML.Bank.byId(list[0]);
  startSession({ subject: first ? first.subject : 'toan' }, list, 'Ôn lại nhóm câu', go);
}

/* ---------- Bộ lọc trang Ôn tập của tôi ---------- */
function onSetKind(btn, go) {
  const cur = G.App.parseQuery((location.hash.split('?')[1]) || '');
  cur.kind = btn.getAttribute('data-kind');
  const qs = Object.keys(cur).filter(function (k) { return cur[k]; }).map(function (k) { return k + '=' + encodeURIComponent(cur[k]); }).join('&');
  go('#/my' + (qs ? '?' + qs : ''));
}
function onFilterSubmit(form, go) {
  const cur = G.App.parseQuery((location.hash.split('?')[1]) || '');
  const qs = [
    'subject=' + encodeURIComponent(form.subject.value),
    'chapter=' + encodeURIComponent(form.chapter.value),
    'cog=' + encodeURIComponent(form.cog.value),
    'kind=' + encodeURIComponent(cur.kind || 'all')
  ].join('&');
  go('#/my?' + qs);
}
/* ---------- Gắn tất cả sự kiện cho một trang đã render ---------- */
function bind(root, route, go) {
  /* Form tìm kiếm toàn trang */
  const searchForm = root.querySelector('#searchPageForm');
  if (searchForm) {
    searchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const input = searchForm.querySelector('input[name="q"]');
      const query = input ? input.value.trim() : '';
      if (query) go('#/search?q=' + encodeURIComponent(query));
    });
  }
  /* Form trả lời câu hỏi */
  const answerForm = root.querySelector('#answerForm');
  if (answerForm) {
    answerForm.addEventListener('submit', function (e) {
      e.preventDefault();
      onAnswer(root, answerForm);
    });
  }
  /* Form chọn luyện tập */
  const setupForm = root.querySelector('#setupForm');
  if (setupForm) {
    setupForm.addEventListener('submit', function (e) {
      e.preventDefault();
      onSetupSubmit(setupForm, go);
    });
    function setOptions(select, items, placeholder, getValue, getLabel, selected) {
      if (!select) return;
      const valid = items.some(function (item) { return getValue(item) === selected; });
      select.innerHTML = '<option value="">' + placeholder + '</option>' + items.map(function (item) {
        const value = getValue(item);
        const label = getLabel(item);
        return '<option value="' + ML.esc(value) + '"' + (valid && value === selected ? ' selected' : '') + '>' + ML.esc(label) + '</option>';
      }).join('');
      if (!valid) select.value = '';
    }
    function updatePracticeOptions(level) {
      const subject = setupForm.subject.value;
      const oldChapter = setupForm.chapter.value;
      const oldLesson = setupForm.lesson.value;
      const oldTopic = setupForm.topic ? setupForm.topic.value : '';
      const chapters = [];
      const sub = C.getSubject(subject);
      sub.semesters.forEach(function (sem) { sem.chapters.forEach(function (ch) { chapters.push(ch); }); });
      if (level === 'subject') setOptions(setupForm.chapter, chapters, 'Tất cả chương', x => x.id, x => x.name, '');
      else setOptions(setupForm.chapter, chapters, 'Tất cả chương', x => x.id, x => x.name, oldChapter);
      const chapter = setupForm.chapter.value;
      const lessons = C.allLessons().filter(function (l) { return l.subjectId === subject && (!chapter || l.chapterId === chapter); });
      setOptions(setupForm.lesson, lessons, 'Tất cả bài', x => x.lessonId, x => x.name, level === 'subject' || level === 'chapter' ? '' : oldLesson);
      const lesson = setupForm.lesson.value;
      const topics = C.allTopics().filter(function (t) { return t.subjectId === subject && (!chapter || t.chapterId === chapter) && (!lesson || t.lessonId === lesson); });
      setOptions(setupForm.topic, topics, 'Tất cả chủ đề', x => x.topicId, x => x.name, level === 'subject' || level === 'chapter' || level === 'lesson' ? '' : oldTopic);
    }
    setupForm.addEventListener('change', function (e) {
      if (e.target.name === 'subject') updatePracticeOptions('subject');
      else if (e.target.name === 'chapter') updatePracticeOptions('chapter');
      else if (e.target.name === 'lesson') updatePracticeOptions('lesson');
      /* Các lựa chọn khác được giữ nguyên đến khi người dùng bấm Bắt đầu. */
    });
  }
  /* Form ghi chú lý thuyết */
  Array.prototype.forEach.call(root.querySelectorAll('form[data-act="noteForm"]'), function (f) {
    f.addEventListener('submit', function (e) { e.preventDefault(); onNoteSubmit(f); });
  });
  /* Form bộ lọc Ôn tập của tôi */
  const filterForm = root.querySelector('form[data-act="filterForm"]');
  if (filterForm) {
    filterForm.addEventListener('submit', function (e) { e.preventDefault(); onFilterSubmit(filterForm, go); });
  }
  /* Nút import dữ liệu */
  const imp = root.querySelector('#importFile');
  if (imp) {
    imp.addEventListener('change', function () {
      if (imp.files && imp.files[0]) S.importJSON(imp.files[0]);
    });
  }

  /* Click cho các nút data-act */
  root.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-act]');
    if (!btn || btn.tagName === 'FORM' || btn.type === 'submit') return;
    const act = btn.getAttribute('data-act');
    const id = btn.getAttribute('data-id');
    switch (act) {
      case 'hint': onHint(root, id); break;
      case 'flag': onFlag(btn, id); break;
      case 'understood':
        if (btn.hasAttribute('data-v')) onUnderstood(btn, id, btn.getAttribute('data-v') === '1');
        else onTheoryUnderstood(btn, id);
        break;
      case 'bookmark': onBookmark(btn, id); break;
      case 'needReview': onNeedReview(btn, id); break;
      case 'noteEdit': onNoteEdit(btn); break;
      case 'noteDel': case 'note-del': onNoteDel(btn); break;
      case 'saveFormula': onSaveFormula(btn); break;
      case 'formulaDel': case 'formula-del': onFormulaDel(btn); break;
      case 'flip': onFlip(btn); break;
      case 'reveal': {
        const ans = btn.parentElement.querySelector('.selfq__a');
        if (ans) { ans.hidden = !ans.hidden; btn.textContent = ans.hidden ? 'Hiện đáp án' : 'Ẩn đáp án'; }
        break;
      }
      case 'setKind': onSetKind(btn, go); break;
      case 'startGroup': onStartGroup(btn, go); break;
      case 'toggleDark':
        S.settings.setDark(!S.settings.get('dark'));
        G.App.render();
        break;
      case 'export': S.exportJSON(); break;
      case 'reset': S.reset(); break;
      default: break;
    }
  });

  /* Phím Enter/Space lật flashcard */
  root.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('flash')) {
      e.preventDefault();
      onFlip(e.target);
    }
  });
}

G.Bind = bind;

})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-module="app-router">
/* ===== MODULE: app-router (js/app.js) ===== */
/* ============================================================
   APP — Router (hash), sidebar, topbar, khởi tạo
   Route:
     #/overview       Tổng quan học tập
     #/theory/:subj   Ôn tập lý thuyết
     #/lesson/:id     Chi tiết một bài lý thuyết
     #/practice       Luyện tập ứng dụng
     #/quiz?...       Màn hình làm bài
     #/my             Ôn tập của tôi (câu đúng/sai/chưa hiểu/đánh dấu)
     #/history        Lịch sử luyện tập
     #/notes          Sổ tay kiến thức
     #/reinforce      Chủ đề cần củng cố
     #/settings       Cài đặt & dữ liệu cá nhân
   ============================================================ */
(function (G) {
'use strict';

const ICONS = {
  overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  theory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  practice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 4h6l1 3H8z"/><path d="M9 13h6"/></svg>',
  my: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>',
  notes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  reinforce: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>'
};

const NAV = [
  { group: 'Học tập', items: [
    { route: '#/overview', label: 'Tổng quan học tập', icon: 'overview' },
    { route: '#/theory', label: 'Ôn tập lý thuyết', icon: 'theory' },
    { route: '#/practice', label: 'Luyện tập ứng dụng', icon: 'practice' }
  ]},
  { group: 'Ôn tập của tôi', items: [
    { route: '#/my', label: 'Câu đúng – câu sai', icon: 'my' },
    { route: '#/history', label: 'Lịch sử luyện tập', icon: 'history' },
    { route: '#/notes', label: 'Sổ tay kiến thức', icon: 'notes' },
    { route: '#/reinforce', label: 'Chủ đề cần củng cố', icon: 'reinforce' }
  ]},
  { group: 'Khác', items: [
    { route: '#/settings', label: 'Cài đặt & dữ liệu', icon: 'settings' }
  ]}
];

const TITLES = {
  overview: 'Tổng quan học tập',
  theory: 'Ôn tập lý thuyết',
  lesson: 'Bài học',
  practice: 'Luyện tập ứng dụng',
  run: 'Đang luyện tập',
  question: 'Câu hỏi',
  review: 'Ôn tập của tôi',
  my: 'Ôn tập của tôi',
  history: 'Lịch sử luyện tập',
  notes: 'Sổ tay kiến thức',
  reinforce: 'Chủ đề cần củng cố',
  settings: 'Cài đặt & dữ liệu',
  search: 'Tìm kiếm nội dung'
};

function parseQuery(str) {
  const out = {};
  String(str || '').split('&').forEach(function (kv) {
    if (!kv) return;
    const i = kv.indexOf('=');
    const k = decodeURIComponent(i >= 0 ? kv.slice(0, i) : kv);
    const v = i >= 0 ? decodeURIComponent(kv.slice(i + 1)) : '';
    out[k] = v;
  });
  return out;
}

function currentRoute() {
  const h = location.hash || '#/overview';
  const qi = h.indexOf('?');
  const path = qi >= 0 ? h.slice(0, qi) : h;
  const query = qi >= 0 ? parseQuery(h.slice(qi + 1)) : {};
  const parts = path.replace(/^#\/?/, '').split('/').filter(Boolean);
  return {
    path: path, query: query,
    key: parts[0] || 'overview',
    arg: parts[1] || null,
    arg2: parts[2] || null
  };
}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function routeTitle(r) {
  if (r.key === 'review') {
    const labels = { wrong: 'Ôn câu sai', correct: 'Ôn câu đúng', flagged: 'Câu đã đánh dấu', understood: 'Câu đã hiểu', all: 'Ôn tập của tôi' };
    return labels[r.query.kind] || 'Câu cần ôn lại';
  }
  return TITLES[r.key] || 'Ôn tập';
}

function routedReviewActive(active, route) {
  return active === '#/review' && route === '#/my';
}

function renderSidebar() {
  const app = document.getElementById('app');
  let aside = document.getElementById('sidebar');
  if (!aside) {
    aside = document.createElement('aside');
    aside.id = 'sidebar';
    aside.className = 'sidebar';
    app.insertBefore(aside, app.firstChild);
  }
  const active = currentRoute().path;
  aside.innerHTML =
    '<div class="sidebar__brand">' +
      '<div class="sidebar__brand-mark" aria-hidden="true">12<span>+</span></div>' +
      '<div class="sidebar__brand-copy">' +
        '<div class="sidebar__brand-title">Ôn tập Toán 12 &amp; Vật lí 12</div>' +
        '<div class="sidebar__brand-sub">KẾT NỐI TRI THỨC</div>' +
      '</div>' +
    '</div>' +
    '<nav class="nav" aria-label="Điều hướng chính">' +
      NAV.map(function (grp) {
        return '<div class="nav__group">' +
          '<div class="nav__label">' + G.UI.esc(grp.group) + '</div>' +
          grp.items.map(function (it) {
            const on = active === it.route || active.indexOf(it.route + '/') === 0 ||
              (routedReviewActive(active, it.route));
            return '<button type="button" class="nav__item' + (on ? ' is-active' : '') +
              '" data-route="' + it.route + '">' + ICONS[it.icon] +
              '<span>' + G.UI.esc(it.label) + '</span></button>';
          }).join('') +
        '</div>';
      }).join('') +
    '</nav>';
  renderMobileDock();
}

/* Thanh điều hướng cố định cho điện thoại: các khu vực dùng thường xuyên ở ngay dưới ngón tay. */
function renderMobileDock() {
  let dock = document.getElementById('mobileDock');
  if (!dock) {
    dock = document.createElement('nav');
    dock.id = 'mobileDock';
    dock.className = 'mobile-dock';
    dock.setAttribute('aria-label', 'Điều hướng trên điện thoại');
    document.body.appendChild(dock);
  }
  const r = currentRoute();
  const ownPages = ['my', 'review', 'history', 'notes', 'reinforce'].indexOf(r.key) >= 0;
  const theoryActive = r.key === 'theory' || r.key === 'lesson';
  const practiceActive = r.key === 'practice' || r.key === 'question';
  const items = [
    { route: '#/overview', key: 'overview', label: 'Tổng quan', icon: 'overview', active: r.key === 'overview' },
    { route: '#/theory', key: 'theory', label: 'Lý thuyết', icon: 'theory', active: theoryActive },
    { route: '#/practice', key: 'practice', label: 'Luyện tập', icon: 'practice', active: practiceActive },
    { route: '#/my', key: 'my', label: 'Ôn của tôi', icon: 'my', active: ownPages }
  ];
  dock.innerHTML = items.map(function (it) {
    return '<button type="button" class="mobile-dock__item' + (it.active ? ' is-active' : '') + '"' +
      ' data-route="' + it.route + '"' + (it.active ? ' aria-current="page"' : '') + '>' +
      '<span class="mobile-dock__icon" aria-hidden="true">' + ICONS[it.icon] + '</span>' +
      '<span class="mobile-dock__label">' + G.UI.esc(it.label) + '</span></button>';
  }).join('') +
    '<button type="button" class="mobile-dock__item' + (r.key === 'settings' || r.key === 'search' ? ' is-active' : '') + '" id="mobileMore" aria-label="Mở thêm mục" aria-haspopup="true" aria-expanded="false">' +
      '<span class="mobile-dock__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>' +
      '<span class="mobile-dock__label">Thêm</span></button>';
  const more = document.getElementById('mobileMore');
  if (more) more.addEventListener('click', toggleSidebar);
}

function renderTopbar() {
  const bar = document.getElementById('topbar');
  const r = currentRoute();
  const dark = !!G.Store.settings.get('dark');
  bar.innerHTML =
    '<button type="button" class="hamburger" id="btnMenu" aria-label="Mở menu">☰</button>' +
    '<div class="topbar__title">' + G.UI.esc(routeTitle(r)) + '</div>' +
    '<form class="topbar__search" id="globalSearchForm" role="search" aria-label="Tìm kiếm bài học và câu hỏi">' +
      '<span class="topbar__search-icon" aria-hidden="true">⌕</span>' +
      '<input id="globalSearchInput" name="q" type="search" autocomplete="off" placeholder="Tìm bài học, công thức, câu hỏi…" value="' + G.UI.esc(r.key === 'search' ? (r.query.q || '') : '') + '" aria-label="Tìm bài học, công thức, câu hỏi" />' +
      '<kbd>Ctrl K</kbd>' +
    '</form>' +
    '<button type="button" class="btn btn--sm" id="btnDark" aria-pressed="' + dark + '">' +
      (dark ? '☀ Sáng' : '◐ Tối') + '</button>';
  document.getElementById('btnMenu').addEventListener('click', toggleSidebar);
  document.getElementById('globalSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const q = document.getElementById('globalSearchInput').value.trim();
    if (q) go('#/search?q=' + encodeURIComponent(q));
  });
  document.getElementById('btnDark').addEventListener('click', function () {
    G.Store.settings.setDark(!dark);
    renderTopbar();
  });
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  if (!sb) return;
  const open = sb.classList.toggle('is-open');
  const menuButton = document.getElementById('btnMenu');
  const moreButton = document.getElementById('mobileMore');
  if (menuButton) menuButton.setAttribute('aria-expanded', String(open));
  if (moreButton) moreButton.setAttribute('aria-expanded', String(open));
  let scrim = document.getElementById('scrim');
  if (open) {
    if (!scrim) {
      scrim = document.createElement('div');
      scrim.id = 'scrim';
      scrim.className = 'scrim';
      document.body.appendChild(scrim);
      scrim.addEventListener('click', toggleSidebar);
    }
    scrim.style.display = 'block';
  } else if (scrim) {
    scrim.style.display = 'none';
  }
}

function render() {
  renderSidebar();
  renderTopbar();
  const r = currentRoute();
  const content = document.getElementById('content');
  content.innerHTML = '<div class="card" style="text-align:center;padding:44px"><span class="spinner"></span></div>';
  if (window.scrollTo) window.scrollTo(0, 0);

  const V = G.VIEWS || {};
  const p = r.query || {};
  let view;
  try {
    switch (r.key) {
      case 'theory':
        view = r.arg === 'lesson'
          ? (V.theoryLesson ? V.theoryLesson(p) : V.overview(p))
          : (V.theory ? V.theory(p) : V.overview(p));
        break;
      case 'lesson':
        /* Dạng ngắn #/lesson/<id> (dùng trong Sổ tay) */
        view = V.theoryLesson ? V.theoryLesson(Object.assign({}, p, { id: r.arg })) : V.overview(p);
        break;
      case 'practice':
        view = r.arg === 'run'
          ? (V.run ? V.run(p) : V.overview(p))
          : (V.practice ? V.practice(p) : V.overview(p));
        break;
      case 'question': view = V.question ? V.question(p) : V.overview(p); break;
      case 'search': view = V.search ? V.search(p) : V.overview(p); break;
      case 'review': view = V.review ? V.review(p) : V.overview(p); break;
      case 'my': view = V.my ? V.my(p) : V.overview(p); break;
      case 'history': view = V.history ? V.history(p) : V.overview(p); break;
      case 'notes': view = V.notes ? V.notes(p) : V.overview(p); break;
      case 'reinforce': view = V.reinforce ? V.reinforce(p) : V.overview(p); break;
      case 'settings': view = V.settings ? V.settings(p) : V.overview(p); break;
      case 'overview':
      default: view = V.overview ? V.overview(p) : G.UI.empty('Thiếu module giao diện', 'Không tải được trang tổng quan.', '');
    }
  } catch (err) {
    console.error(err);
    view = G.UI.empty('Không hiển thị được trang này', err.message,
      '<button type="button" class="btn btn--primary" data-route="#/overview">Về trang tổng quan</button>');
  }
  content.innerHTML = view;
  /* Render công thức: thuộc tính data-tex rồi tới $...$ trong văn bản */
  try {
    G.MathLib.renderInto(content);
    G.MathLib.renderMath(content);
  } catch (errMath) { console.warn('[math]', errMath); }
  if (G.Bind) G.Bind(content, r, go);
  document.title = routeTitle(r) + ' — Toán 12 & Vật lí 12';
}

/* Ủy quyền click cho nút điều hướng */
document.addEventListener('click', function (e) {
  const el = e.target && e.target.closest ? e.target.closest('[data-route]') : null;
  if (!el || el.tagName === 'A') return;
  e.preventDefault();
  go(el.getAttribute('data-route'));
  const sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('is-open')) toggleSidebar();
});

/* Phím tắt: Ctrl/Cmd+K hoặc / để mở tìm kiếm toàn website. */
document.addEventListener('keydown', function (e) {
  const target = e.target;
  const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    const input = document.getElementById('globalSearchInput');
    if (input) input.focus();
  } else if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    const input = document.getElementById('globalSearchInput');
    if (input) input.focus();
  }
});

/* Kiểm tra tính hợp lệ ngân hàng câu hỏi trước khi dùng */
function validateBank() {
  const problems = [];
  const seen = {};
  G.MathLib.Bank.all().forEach(function (q) {
    if (seen[q.id]) { problems.push(q.id + ': trùng id'); return; }
    seen[q.id] = 1;
    if (!q.question) problems.push(q.id + ': thiếu nội dung câu hỏi');
    if (!q.chapterId || !q.lessonId || !q.topicId) problems.push(q.id + ': thiếu liên kết chương/bài/chủ đề');
    if (q.type === 'mc1') {
      if (!Array.isArray(q.options) || q.options.length < 2) problems.push(q.id + ': mc1 cần ít nhất 2 phương án');
      else if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= q.options.length) problems.push(q.id + ': đáp án đúng mc1 ngoài phạm vi');
    }
    if (q.type === 'mcq' && !Array.isArray(q.correct)) problems.push(q.id + ': mcq cần mảng đáp án đúng');
    if (q.type === 'numeric' && (!q.numeric || q.numeric.answer === undefined)) problems.push(q.id + ': thiếu đáp số');
    if (!q.explain || !q.explain.correct) problems.push(q.id + ': thiếu giải thích đáp án đúng');
    if (!q.explain || !q.explain.steps || !q.explain.steps.length) problems.push(q.id + ': thiếu lời giải từng bước');
  });
  return problems;
}

function init() {
  G.Store.settings.setDark(!!G.Store.settings.get('dark'));
  if (!location.hash) location.hash = '#/overview';
  window.addEventListener('hashchange', render);
  render();
  /* Ngân hàng 100K câu cần một lượt rà soát khá nặng. Để trang và thao tác chạm
     phản hồi trước, chạy kiểm tra toàn bộ ở thời điểm rảnh thay vì chặn lần mở app. */
  const runValidation = function () {
    const problems = validateBank();
    if (problems.length) console.warn('[validate] ' + problems.length + ' vấn đề dữ liệu:\n' + problems.join('\n'));
    else console.info('[validate] ngân hàng câu hỏi hợp lệ: ' + G.MathLib.Bank.all().length + ' câu');
  };
  if (typeof window.requestIdleCallback === 'function') window.requestIdleCallback(runValidation, { timeout: 6000 });
  else window.setTimeout(runValidation, 1800);
  if (!window.katex) G.UI.toast('Chưa tải được thư viện KaTeX. Công thức có thể hiển thị dạng văn bản thô.', 'bad');
}

G.App = {
  go: go, render: render, route: currentRoute, parseQuery: parseQuery,
  validateBank: validateBank, toggleSidebar: toggleSidebar
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})(typeof window !== 'undefined' ? window : globalThis);
</script>
